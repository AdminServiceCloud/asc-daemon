// asc-daemon API contracts — the source of truth.
// The AdminService.Cloud platform links these files (buf dependency) and
// generates its clients from them; the daemon generates its Rust code from
// the same files (prost/tonic). Changes must stay backward-compatible:
// add optional fields, never remove or renumber existing ones.
syntax = "proto3";

package asc.daemon.v1;

// Go import path for the platform, which generates its client straight from
// these files. Ignored by prost/tonic, and it carries no wire meaning.
option go_package = "github.com/AdminServiceCloud/asc-platform/gen/go/asc/daemon/v1;daemonv1";

// Daemon-level information.
service DaemonService {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
}

// Privileged host lifecycle operations. These do not accept a command or
// arguments: the only supported action is a full operating-system reboot.
service SystemService {
  rpc RebootSystem(RebootSystemRequest) returns (RebootSystemResponse);
}

message RebootSystemRequest {}

message RebootSystemResponse {
  // The request was accepted before the machine begins shutting down.
  bool accepted = 1;
}

message GetStatusRequest {}

message GetStatusResponse {
  // Daemon version, e.g. "0.1.0".
  string version = 1;
  uint32 apps_total = 2;
  uint32 apps_running = 3;
  // Optional features this daemon build supports, e.g. "app.upgrade",
  // "app.settings", "app.ports", "app.stats", "console.exec", "sources",
  // "credentials" (DMN-076). Absent/empty on a daemon built before this
  // field existed — a caller that needs to know falls back to trying the
  // RPC and handling UNIMPLEMENTED. Values are added here as the matching
  // capability ships; never removed once shipped.
  repeated string capabilities = 4;
}

// App lifecycle management. The REST transport exposes the same operations
// (see docs/api.md for the route mapping); both share one service layer.
service AppService {
  rpc ListApps(ListAppsRequest) returns (ListAppsResponse);
  rpc GetApp(GetAppRequest) returns (GetAppResponse);
  // Disk usage breakdown (DMN-035): image, repository, data, custom volumes.
  rpc GetAppDisk(GetAppDiskRequest) returns (GetAppDiskResponse);
  // Install from the configured registries: "name" or "name@version".
  rpc InstallApp(InstallAppRequest) returns (InstallAppResponse);
  rpc StartApp(StartAppRequest) returns (StartAppResponse);
  rpc StopApp(StopAppRequest) returns (StopAppResponse);
  rpc RestartApp(RestartAppRequest) returns (RestartAppResponse);
  rpc GetAppLogs(GetAppLogsRequest) returns (GetAppLogsResponse);
  // Removes the app and all its data. Irreversible.
  rpc RemoveApp(RemoveAppRequest) returns (RemoveAppResponse);
  // Temporary one-time token required to open a WebSocket console session
  // (DMN-007). The platform requests it automatically after checking the
  // caller's permissions; short TTL, bound to one app and session type.
  rpc IssueConsoleToken(IssueConsoleTokenRequest) returns (IssueConsoleTokenResponse);
}

enum AppState {
  APP_STATE_UNSPECIFIED = 0;
  APP_STATE_RUNNING = 1;
  APP_STATE_STOPPED = 2;
}

message App {
  string id = 1;
  string name = 2;
  // Runtime kind: docker | systemd | process.
  string kind = 3;
  AppState state = 4;
  string version = 5;
  // Package origin: "<source>:<git url>".
  string source = 6;
  // Owning Linux user name.
  string owner = 7;
  // The package title when the app carries a custom name (then `name` is
  // the custom name); absent otherwise.
  optional string title = 8;
  // Resource quota limits, when any are set (DMN-021).
  optional AppQuota quota = 9;
  // Stable instance identity generated at install (DMN-044); absent for apps
  // installed before it. Unlike `id`, never reused after removal.
  optional string uuid = 10;
}

// Per-app resource limits; every field is optional — only set limits appear.
message AppQuota {
  optional double cpu_cores = 1;
  optional uint64 ram_bytes = 2;
  optional uint64 disk_bytes = 3;
}

message ListAppsRequest {}

message ListAppsResponse {
  repeated App apps = 1;
}

message GetAppRequest {
  string id = 1;
}

message GetAppResponse {
  App app = 1;
}

message GetAppDiskRequest {
  string id = 1;
}

message GetAppDiskResponse {
  // Everything under the app directory (repository + data + config + any
  // private volume folders) — what the quota measures.
  uint64 app_dir_bytes = 1;
  // From asc.settings.yaml quota.max_disk, normalized to bytes.
  optional uint64 quota_bytes = 2;
  // Docker image size; absent for non-Docker apps or an unpulled image.
  optional uint64 image_bytes = 3;
  uint64 repository_bytes = 4;
  uint64 data_bytes = 5;
  // Custom volumes only — the default private volume is covered by
  // data_bytes.
  repeated AppVolumeUsage volumes = 6;
}

message AppVolumeUsage {
  // The raw asc.settings.yaml volume entry.
  string entry = 1;
  // Resolved host path, or the Docker volume name when it has no
  // mountpoint yet.
  string path = 2;
  // Absent when the size could not be determined.
  optional uint64 bytes = 3;
  // A Docker named volume — may be mounted by other apps too.
  bool shared = 4;
  // Whether `bytes` is already included in app_dir_bytes.
  bool counted = 5;
}

message InstallAppRequest {
  // "name", "stack" or "stack/app", optionally with "@version"
  // (version = git tag of the package repo), or a direct git repository
  // URL (https://, ssh:// or git@host:path — DMN-040).
  string spec = 1;
  // Registry source to install from; empty = automatic. Required when
  // several sources provide the package (the error lists them).
  string source = 2;
  // Custom app name (DMN-024); for a stack — the per-app name prefix.
  optional string name = 3;
  // Branch or tag to check out — direct repository installs only.
  optional string branch = 4;
  optional string tag = 5;
  // Consent to the package license (DMN-028). Without it a repository
  // shipping a LICENSE fails with the structured license error.
  bool license_ack = 6;
}

message InstallAppResponse {
  // Installed app id; for stack installs — the stack name.
  string id = 1;
  // Installed version; for stack installs — the version of the first app.
  string version = 2;
  // Stack installs: every freshly installed app, in dependency order.
  repeated InstalledApp apps = 3;
  // Stack installs: apps that were already installed and were skipped.
  repeated string skipped = 4;
}

message InstalledApp {
  string id = 1;
  string version = 2;
}

message StartAppRequest {
  string id = 1;
}

message StartAppResponse {
  // True when the app was already running (idempotent call).
  bool already_running = 1;
}

message StopAppRequest {
  string id = 1;
}

message StopAppResponse {
  bool already_stopped = 1;
}

message RestartAppRequest {
  string id = 1;
}

message RestartAppResponse {}

message GetAppLogsRequest {
  string id = 1;
  // Number of trailing lines; 0 means the server default (100).
  uint32 tail = 2;
}

message GetAppLogsResponse {
  string logs = 1;
}

message RemoveAppRequest {
  string id = 1;
}

message RemoveAppResponse {}

enum ConsoleSessionType {
  CONSOLE_SESSION_TYPE_UNSPECIFIED = 0;
  // Read-only log stream.
  CONSOLE_SESSION_TYPE_LOGS = 1;
  // Interactive attach (stdin/stdout).
  CONSOLE_SESSION_TYPE_ATTACH = 2;
  // Interactive shell inside a running container — docker apps only
  // (DMN-082). Frames on this session are tagged (0x00 data, 0x01 resize:
  // big-endian u16 cols then u16 rows), unlike LOGS/ATTACH which are not.
  CONSOLE_SESSION_TYPE_EXEC = 3;
}

message IssueConsoleTokenRequest {
  string app_id = 1;
  ConsoleSessionType session = 2;
  // EXEC only: the command to run. Empty asks the daemon to probe a shell
  // (/bin/bash, falling back to /bin/sh).
  repeated string command = 3;
}

message IssueConsoleTokenResponse {
  string token = 1;
  // Unix seconds when the token expires (~30s TTL, single use).
  int64 expires_at = 2;
}

// Registry sources pushed by the platform (DMN-083, REG-005): the
// organization-level source of truth for an org's registries lives on the
// platform; this service is how it lands in this node's own system-scope
// sources.toml. Every RPC here operates on Scope::System only — the
// platform never touches a Linux user's own ~/.config/asc/sources.toml,
// which stays under `asc source` CLI control.
service SourceService {
  rpc ListSources(ListSourcesRequest) returns (ListSourcesResponse);
  // Idempotent full replace of the system source list (see
  // SourceList::replace_all): `sources` becomes the entire list, deletions
  // included. Chosen over incremental add/remove RPCs because the platform
  // always knows its whole desired state and a partial-apply retry after a
  // dropped connection must not be possible.
  rpc ReplaceSources(ReplaceSourcesRequest) returns (ReplaceSourcesResponse);
}

message Source {
  string name = 1;
  string url = 2;
}

message ListSourcesRequest {}

message ListSourcesResponse {
  // System sources only, priority order; user-scope sources are invisible
  // here by design.
  repeated Source sources = 1;
}

message ReplaceSourcesRequest {
  // Complete desired system source list; empty clears every system source
  // (falls back to the synthesized "official" default).
  repeated Source sources = 1;
}

message ReplaceSourcesResponse {
  repeated Source sources = 1;
}

// Credential management (DMN-084/DMN-087). Unlike SourceService, this is
// targeted upsert/remove, not a full replace: /etc/asc/auth.json can carry
// Kind::Registry (docker image pull) credentials an operator added by hand
// for reasons unrelated to marketplace registries, and a bulk replace would
// stomp them.
//
// Two secret shapes: a token, or (DMN-087) raw PEM private-key bytes — the
// daemon writes the key to a 0600 file it owns under /etc/asc/ssh-keys and
// registers a Method::SshKey pointing at it, the same shape `asc auth add
// --ssh-key` produces by hand. The file is created with 0600 from the
// moment it exists (no readable-then-chmod window) and is removed again
// when the credential is replaced by something else or removed outright.
// Advertised as the separate "ssh-credentials" capability (GetStatus) so a
// platform talking to an older daemon can still push token credentials
// while skipping ssh-key ones with an explicit per-registry error instead
// of hitting UNIMPLEMENTED.
service CredentialService {
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse);
  // Upsert-by-(kind, pattern, app) — identical to GitAuth::add's existing
  // semantics; calling it again with the same triple replaces the secret,
  // token-for-token or key-for-key alike.
  rpc UpsertCredential(UpsertCredentialRequest) returns (UpsertCredentialResponse);
  rpc RemoveCredential(RemoveCredentialRequest) returns (RemoveCredentialResponse);
}

enum CredentialKind {
  CREDENTIAL_KIND_UNSPECIFIED = 0;
  CREDENTIAL_KIND_REPO = 1;
  CREDENTIAL_KIND_REGISTRY = 2;
}

// Never carries the secret — method_label mirrors Method::label() ("token"
// or "ssh-key <path>"), has_secret says whether one is configured (true for
// either method).
message CredentialSummary {
  CredentialKind kind = 1;
  string pattern = 2;
  optional string username = 3;
  optional string app = 4;
  string method_label = 5;
  bool has_secret = 6;
}

message ListCredentialsRequest {}

message ListCredentialsResponse {
  repeated CredentialSummary credentials = 1;
}

message UpsertCredentialRequest {
  CredentialKind kind = 1;
  // Host/prefix, or a full git URL to derive it from (GitAuth::normalize).
  string target = 2;
  oneof secret {
    string token = 3;
    // PEM-encoded (OpenSSH or PKCS8) private key bytes (DMN-087). The
    // daemon owns the file it ends up in — see the CredentialService
    // comment above.
    string ssh_private_key_pem = 6;
  }
  optional string username = 4;
  optional string app = 5;
}

message UpsertCredentialResponse {
  CredentialSummary credential = 1;
}

message RemoveCredentialRequest {
  optional CredentialKind kind = 1;
  string target = 2;
}

message RemoveCredentialResponse {}

// System monitoring (DMN-006). The daemon samples metrics in the background
// (config `[monitor]`, default every 100ms — DMN-072) into an in-memory ring
// buffer; GetSystemMetrics/GetMetricsHistory read from that buffer, while
// StreamSystemMetrics subscribes to the live sampler directly. REST mirror:
// GET /v1/metrics, GET /v1/metrics/history?limit=N, GET /v1/network/interfaces.
service MonitorService {
  // Latest sample. Fails with UNAVAILABLE right after startup until the
  // first sample lands (typically < 1s).
  rpc GetSystemMetrics(GetSystemMetricsRequest) returns (GetSystemMetricsResponse);
  // Recent samples, oldest first.
  rpc GetMetricsHistory(GetMetricsHistoryRequest) returns (GetMetricsHistoryResponse);
  // Every sample as it is taken, pushed for as long as the caller keeps the
  // stream open. Callers that fall behind the sampler's broadcast buffer
  // just miss the oldest queued frames rather than stalling it (DMN-072).
  rpc StreamSystemMetrics(StreamSystemMetricsRequest) returns (stream SystemMetrics);
  // Every network interface on the machine, loopback included — an
  // inventory, not a metric: MAC, MTU, state and every IPv4/IPv6 address
  // (DMN-074).
  rpc ListNetworkInterfaces(ListNetworkInterfacesRequest) returns (ListNetworkInterfacesResponse);
}

message SystemMetrics {
  // Unix seconds when the sample was taken.
  int64 timestamp = 1;
  // Busy CPU share since the previous sample, 0-100. Absent on the very
  // first sample (usage is a delta of two readings).
  optional double cpu_usage_percent = 2;
  uint32 cpu_cores = 3;
  double load1 = 4;
  double load5 = 5;
  double load15 = 6;
  // Memory sizes in bytes; used = total - available.
  uint64 mem_total = 7;
  uint64 mem_used = 8;
  uint64 mem_available = 9;
  uint64 swap_total = 10;
  uint64 swap_used = 11;
  uint64 uptime_secs = 12;
  repeated DiskMetrics disks = 13;
  repeated NetworkMetrics network = 14;
  // Every GPU found on the machine; empty on a server without one.
  repeated GpuMetrics gpus = 15;
  // Per-device disk read/write throughput (DMN-073); empty when
  // /proc/diskstats cannot be read.
  repeated DiskIoMetrics disk_io = 16;
}

// One mounted real filesystem; sizes in bytes.
message DiskMetrics {
  string mount = 1;
  string filesystem = 2;
  uint64 total = 3;
  uint64 used = 4;
  // What unprivileged users can allocate (statvfs f_bavail).
  uint64 available = 5;
}

// One network interface (loopback excluded). Byte/error counters are
// cumulative since boot; per-second rates are deltas between samples.
message NetworkMetrics {
  string interface = 1;
  uint64 rx_bytes = 2;
  uint64 tx_bytes = 3;
  uint64 rx_errors = 4;
  uint64 tx_errors = 5;
  // Absent on the first sample.
  optional double rx_bytes_per_sec = 6;
  optional double tx_bytes_per_sec = 7;
}

// One block device from /proc/diskstats (whole disks only — partitions and
// loop/ram/zram devices are filtered out). Byte counters are cumulative
// since boot; per-second rates are deltas between samples, absent on the
// first one.
message DiskIoMetrics {
  string device = 1;
  uint64 read_bytes = 2;
  uint64 write_bytes = 3;
  optional double read_bytes_per_sec = 4;
  optional double write_bytes_per_sec = 5;
  // Milliseconds spent doing I/O, cumulative since boot (field 13 of
  // /proc/diskstats).
  uint64 io_ms = 6;
}

// One GPU. NVIDIA figures come from nvidia-smi, AMD ones from the amdgpu
// sysfs interface; fields a source cannot report are absent rather than zero.
message GpuMetrics {
  // Position in its vendor's enumeration (nvidia-smi index, DRM card number).
  uint32 index = 1;
  // "nvidia" or "amd".
  string vendor = 2;
  string name = 3;
  // Busy share of the graphics engine, 0-100.
  optional double utilization_percent = 4;
  // VRAM sizes in bytes.
  uint64 memory_total = 5;
  uint64 memory_used = 6;
  optional double temperature_c = 7;
  optional double power_watts = 8;
}

message GetSystemMetricsRequest {}

message GetSystemMetricsResponse {
  SystemMetrics metrics = 1;
}

message GetMetricsHistoryRequest {
  // Maximum number of most recent samples; 0 = the whole buffer.
  uint32 limit = 1;
}

message GetMetricsHistoryResponse {
  repeated SystemMetrics samples = 1;
}

message StreamSystemMetricsRequest {}

message ListNetworkInterfacesRequest {}

message ListNetworkInterfacesResponse {
  repeated NetworkInterface interfaces = 1;
}

// One network interface, loopback included. Metadata comes from
// /sys/class/net/<name>; addresses from the kernel's interface address list.
message NetworkInterface {
  string name = 1;
  // Empty for interfaces without a link-layer address (e.g. some tunnels).
  string mac = 2;
  uint32 mtu = 3;
  // "up" or "down", read from /sys/class/net/<name>/operstate.
  string state = 4;
  bool is_loopback = 5;
  repeated InterfaceAddress addresses = 6;
}

message InterfaceAddress {
  string address = 1;
  uint32 prefix_len = 2;
  // "ipv4" or "ipv6".
  string family = 3;
  // "host", "link", "global" etc. — RFC 3549 scope name, when known.
  string scope = 4;
}

// API tokens (DMN-065, DMN-066). Two kinds of bearer token guard this API:
// the long-lived **primary** in api.token — the credential the platform
// stores at enrollment, and from here on a refresh token — and short-lived
// **access** tokens minted from it, kept only in the daemon's memory.
//
// An access token carries the same authority as the primary for every other
// service; what it may not do is manage tokens. Every method below except
// GetTokenStatus therefore requires the primary and answers PERMISSION_DENIED
// otherwise. REST mirror: /v1/token, /v1/token/access, /v1/token/rotate.
service TokenService {
  // Mint a short-lived access token.
  rpc IssueAccessToken(IssueAccessTokenRequest) returns (IssueAccessTokenResponse);
  // Kill every live access token at once — the "a token leaked" button.
  // Also runs as the first step of RotatePrimaryToken.
  rpc RevokeAccessTokens(RevokeAccessTokensRequest) returns (RevokeAccessTokensResponse);
  // Replace the primary and return the new one in plaintext: a platform that
  // reaches the node directly has no other way to learn it.
  rpc RotatePrimaryToken(RotatePrimaryTokenRequest) returns (RotatePrimaryTokenResponse);
  // Confirm that the new primary is stored, ending the grace window early.
  // Must be called with the NEW token; the one it replaced is refused.
  rpc CommitPrimaryTokenRotation(CommitPrimaryTokenRotationRequest) returns (CommitPrimaryTokenRotationResponse);
  // Token state without any token material.
  rpc GetTokenStatus(GetTokenStatusRequest) returns (GetTokenStatusResponse);
}

enum DaemonTokenKind {
  DAEMON_TOKEN_KIND_UNSPECIFIED = 0;
  DAEMON_TOKEN_KIND_PRIMARY = 1;
  DAEMON_TOKEN_KIND_ACCESS = 2;
  // The unix socket: identity came from the kernel, not from a token.
  DAEMON_TOKEN_KIND_LOCAL = 3;
}

message IssueAccessTokenRequest {
  // Requested lifetime; clamped by the daemon. 0 = the default (600s).
  uint32 ttl_secs = 1;
  // Free-form note about who asked for it, for the daemon's own reporting.
  string label = 2;
}

message IssueAccessTokenResponse {
  // Plaintext token, returned exactly once and never readable again.
  string token = 1;
  // Unix seconds when it expires.
  int64 expires_at = 2;
  uint32 ttl_secs = 3;
}

message RevokeAccessTokensRequest {}

message RevokeAccessTokensResponse {
  uint32 revoked = 1;
}

message RotatePrimaryTokenRequest {
  // How long the previous primary keeps working, giving the caller time to
  // persist the new one. Unset = 300s, 0 = switch over immediately.
  optional uint32 grace_secs = 1;
}

message RotatePrimaryTokenResponse {
  string token = 1;
  int64 rotated_at = 2;
  // Unix seconds until which the previous token still authenticates; 0 when
  // the caller asked for no grace window.
  int64 grace_until = 3;
  uint32 revoked_access_tokens = 4;
}

message CommitPrimaryTokenRotationRequest {}

message CommitPrimaryTokenRotationResponse {}

message GetTokenStatusRequest {}

message GetTokenStatusResponse {
  // How the calling request authenticated.
  DaemonTokenKind kind = 1;
  // Unix seconds; set only when the caller presented an access token.
  int64 expires_at = 2;
  uint32 access_tokens_live = 3;
  // First 16 hex characters of the primary's SHA-256 — enough to answer "is
  // the token I hold still the current one" without transmitting it.
  string primary_digest = 4;
  bool rotation_pending = 5;
  int64 grace_until = 6;
  uint32 ttl_default_secs = 7;
}

// Node filesystem access (DMN-070). The daemon runs as root and the whole
// tree from "/" is in scope: the platform performs its own per-user
// authorization before it ever reaches here (see docs/api.md). Symlinks are
// reported but never traversed — a recursive operation stops at the link.
// Every method requires a root caller context; a non-root unix-socket peer is
// refused, unlike the rest of this API (see docs/files.md).
service FileService {
  rpc ListDirectory(ListDirectoryRequest) returns (ListDirectoryResponse);
  rpc StatPath(StatPathRequest) returns (StatPathResponse);
  rpc CreateDirectory(CreateDirectoryRequest) returns (CreateDirectoryResponse);
  // Rename and move are one operation: a rename is a move whose destination
  // shares the source's parent.
  rpc MovePath(MovePathRequest) returns (MovePathResponse);
  rpc CopyPath(CopyPathRequest) returns (CopyPathResponse);
  rpc DeletePaths(DeletePathsRequest) returns (DeletePathsResponse);
  rpc CreateArchive(CreateArchiveRequest) returns (CreateArchiveResponse);
  rpc ReadFile(ReadFileRequest) returns (stream FileChunk);
  rpc WriteFile(stream WriteFileRequest) returns (WriteFileResponse);
  // Change of mode and/or owner/group, chmod/chown-style: an unset field
  // leaves that attribute untouched.
  rpc SetPathAttributes(SetPathAttributesRequest) returns (SetPathAttributesResponse);
  // The machine's local users and groups (/etc/passwd, /etc/group), for a
  // UI to offer as a dropdown when reassigning ownership. Root-gated like
  // every other method here, not because the listing itself is sensitive —
  // every file's owner/group name is already visible through ListDirectory
  // — but for the same reason everything else in this service is: it is
  // not scoped per calling user.
  rpc ListSystemIdentities(ListSystemIdentitiesRequest) returns (ListSystemIdentitiesResponse);
}

enum FileKind {
  FILE_KIND_UNSPECIFIED = 0;
  FILE_KIND_FILE = 1;
  FILE_KIND_DIRECTORY = 2;
  FILE_KIND_SYMLINK = 3;
  // Socket, fifo, block/char device: listed, never opened.
  FILE_KIND_OTHER = 4;
}

// One directory entry as lstat sees it: a symlink is always SYMLINK, never
// the kind of what it points at.
message FileEntry {
  string name = 1;
  FileKind kind = 2;
  uint64 size = 3;
  // Unix seconds; 0 when unreadable.
  int64 modified_at = 4;
  // st_mode & 0o7777.
  uint32 mode = 5;
  uint32 uid = 6;
  uint32 gid = 7;
  // User/group name, falling back to the numeric id when unresolvable.
  string owner = 8;
  string group = 9;
  bool is_symlink = 10;
  // Raw readlink() value, unresolved. Set only when is_symlink is true.
  optional string symlink_target = 11;
  // stat() through the link; absent when is_symlink is false or the link is
  // broken.
  optional FileKind target_kind = 12;
}

message ListDirectoryRequest {
  // Absolute path.
  string path = 1;
  // Default false: dotfiles are omitted.
  bool include_hidden = 2;
}

message ListDirectoryResponse {
  // What the daemon actually listed (equals the request path).
  string path = 1;
  // Directories first, then by name, case-insensitively.
  repeated FileEntry entries = 2;
  // True when the entry cap was hit — entries is a prefix, not the whole
  // directory.
  bool truncated = 3;
  uint64 total_entries = 4;
}

message StatPathRequest {
  string path = 1;
}

message StatPathResponse {
  FileEntry entry = 1;
  string parent = 2;
}

message CreateDirectoryRequest {
  string path = 1;
  bool parents = 2;
}

message CreateDirectoryResponse {
  FileEntry entry = 1;
}

message MovePathRequest {
  string source = 1;
  string destination = 2;
  bool overwrite = 3;
}

message MovePathResponse {
  FileEntry entry = 1;
}

message CopyPathRequest {
  string source = 1;
  string destination = 2;
  bool overwrite = 3;
}

message CopyPathResponse {
  FileEntry entry = 1;
  uint64 bytes_copied = 2;
  uint32 files_copied = 3;
}

message DeletePathsRequest {
  repeated string paths = 1;
  bool recursive = 2;
}

// Best-effort per path, like backup pruning: one refusal does not abort the
// rest.
message DeletePathsResponse {
  uint32 deleted = 1;
  repeated DeleteFailure failures = 2;
}

message DeleteFailure {
  string path = 1;
  string error = 2;
}

enum ArchiveFormat {
  ARCHIVE_FORMAT_UNSPECIFIED = 0;
  ARCHIVE_FORMAT_TAR_GZ = 1;
  // Reserved: answers UNIMPLEMENTED until a zip encoder is worth the
  // dependency (see docs/files.md).
  ARCHIVE_FORMAT_ZIP = 2;
}

message CreateArchiveRequest {
  // Names are resolved relative to this directory.
  string directory = 1;
  // Basenames, never paths.
  repeated string names = 2;
  // Absolute destination for the archive file.
  string archive_path = 3;
  ArchiveFormat format = 4;
}

message CreateArchiveResponse {
  FileEntry entry = 1;
  uint64 bytes = 2;
  uint32 files = 3;
}

message ReadFileRequest {
  string path = 1;
  // Resume from this byte offset; 0 = from the start.
  uint64 offset = 2;
}

message FileChunk {
  bytes data = 1;
  // First message only: what the daemon is about to send, so the caller can
  // set Content-Length and draw a real progress bar.
  optional uint64 total_size = 2;
}

message WriteFileHeader {
  string directory = 1;
  // Basename; the daemon joins it to directory itself — a name containing a
  // path separator is rejected.
  string name = 2;
  bool overwrite = 3;
  // Default 0644.
  optional uint32 mode = 4;
  optional uint64 expected_size = 5;
}

message WriteFileRequest {
  // First message only.
  optional WriteFileHeader header = 1;
  bytes data = 2;
}

message WriteFileResponse {
  FileEntry entry = 1;
  uint64 bytes_written = 2;
}

message SetPathAttributesRequest {
  string path = 1;
  // st_mode & 0o7777; unset leaves the mode untouched.
  optional uint32 mode = 2;
  // User/group name from ListSystemIdentities, not a uid/gid: the caller is
  // a UI dropdown, not a script. Unset leaves that half of ownership
  // untouched — chown semantics, not "reset to root".
  optional string owner = 3;
  optional string group = 4;
}

message SetPathAttributesResponse {
  FileEntry entry = 1;
}

message ListSystemIdentitiesRequest {}

message SystemUser {
  string name = 1;
  uint32 uid = 2;
  string home = 3;
}

message SystemGroup {
  string name = 1;
  uint32 gid = 2;
}

message ListSystemIdentitiesResponse {
  // Ordered by uid/gid ascending.
  repeated SystemUser users = 1;
  repeated SystemGroup groups = 2;
}
