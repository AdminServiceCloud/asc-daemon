// asc-daemon API contracts — the source of truth.
// The AdminService.Cloud platform links these files (buf dependency) and
// generates its clients from them; the daemon generates its Rust code from
// the same files (prost/tonic). Changes must stay backward-compatible:
// add optional fields, never remove or renumber existing ones.
syntax = "proto3";

package asc.daemon.v1;

// Go import path for the platform, which generates its client straight from
// these files. Ignored by prost/tonic, and it carries no wire meaning.
option go_package = "github.com/AdminServiceCloud/asc-platform/gen/go/asc/daemon/v1;daemonv1";

// Daemon-level information.
service DaemonService {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
}

// Privileged host lifecycle operations. These do not accept a command or
// arguments: the only supported action is a full operating-system reboot.
service SystemService {
  rpc RebootSystem(RebootSystemRequest) returns (RebootSystemResponse);
}

message RebootSystemRequest {}

message RebootSystemResponse {
  // The request was accepted before the machine begins shutting down.
  bool accepted = 1;
}

message GetStatusRequest {}

message GetStatusResponse {
  // Daemon version, e.g. "0.1.0".
  string version = 1;
  uint32 apps_total = 2;
  uint32 apps_running = 3;
  // Optional features this daemon build supports, e.g. "app.upgrade",
  // "app.settings", "app.ports", "app.stats", "console.exec", "sources",
  // "credentials" (DMN-076). Absent/empty on a daemon built before this
  // field existed — a caller that needs to know falls back to trying the
  // RPC and handling UNIMPLEMENTED. Values are added here as the matching
  // capability ships; never removed once shipped.
  repeated string capabilities = 4;
}

// App lifecycle management. The REST transport exposes the same operations
// (see docs/api.md for the route mapping); both share one service layer.
service AppService {
  rpc ListApps(ListAppsRequest) returns (ListAppsResponse);
  rpc GetApp(GetAppRequest) returns (GetAppResponse);
  // Disk usage breakdown (DMN-035): image, repository, data, custom volumes.
  rpc GetAppDisk(GetAppDiskRequest) returns (GetAppDiskResponse);
  // Image freshness of a Docker app (DMN-120): which image it runs, its
  // version, and whether the registry serves a newer build of the tag.
  // Empty response for non-Docker apps. Capability "app.repull".
  rpc GetAppImage(GetAppImageRequest) returns (GetAppImageResponse);
  // Re-pull a Docker app's mutable-tag image (`latest`) and, if the pull
  // brought a new image and the app is running, restart it onto the new
  // image. FAILED_PRECONDITION for a pinned tag, a digest, a locally built
  // image or a non-Docker app.
  rpc RepullApp(RepullAppRequest) returns (RepullAppResponse);
  // Install from the configured registries: "name" or "name@version".
  rpc InstallApp(InstallAppRequest) returns (InstallAppResponse);
  // Same install, but as a live progress feed instead of one blocking call
  // (DMN-090): a text line per step of the package clone / image pull /
  // image build, ending with the same result InstallApp would have
  // returned — or, on failure, the stream ends with the same error status.
  // A disconnected caller does not cancel the install: it keeps running to
  // completion on the daemon regardless of whether anyone is still watching.
  rpc InstallAppStream(InstallAppRequest) returns (stream InstallAppEvent);
  // Sets the app's custom name (DMN-095); an empty name resets it to the
  // package's own name, same as an app that never had one.
  rpc RenameApp(RenameAppRequest) returns (RenameAppResponse);
  rpc StartApp(StartAppRequest) returns (StartAppResponse);
  rpc StopApp(StopAppRequest) returns (StopAppResponse);
  rpc RestartApp(RestartAppRequest) returns (RestartAppResponse);
  rpc GetAppLogs(GetAppLogsRequest) returns (GetAppLogsResponse);
  // Removes the app and all its data. Irreversible.
  rpc RemoveApp(RemoveAppRequest) returns (RemoveAppResponse);
  // Temporary one-time token required to open a WebSocket console session
  // (DMN-007). The platform requests it automatically after checking the
  // caller's permissions; short TTL, bound to one app and session type.
  rpc IssueConsoleToken(IssueConsoleTokenRequest) returns (IssueConsoleTokenResponse);
  // Live resource usage of the requested apps (DMN-080), like `docker stats
  // --no-stream`: two readings ~500ms apart. `ids` is applied *before* the
  // sampling window, not after — asking for one app must not cost the
  // sampling time of every app on the node.
  rpc GetAppStats(GetAppStatsRequest) returns (GetAppStatsResponse);
  // Push stream of the same samples (DMN-081), backed by one shared sampler
  // per requested app set rather than a blocking read per subscriber —
  // see AppStatsHub. A caller that falls behind the broadcast buffer misses
  // the oldest queued samples rather than stalling the sampler.
  rpc StreamAppStats(StreamAppStatsRequest) returns (stream AppStatsSample);
  // Published ports of one app (DMN-079), including the host↔container
  // remap and protocol. Resolved from the app's package manifest, so it
  // works even while the app is stopped — docker-only; other runtimes
  // return an empty list.
  rpc ListAppPorts(ListAppPortsRequest) returns (ListAppPortsResponse);
  // Settings schema and chosen values (DMN-078/DMN-043): what a settings
  // editor needs to render the same form `asc app settings` does.
  // values_json is a JSON object string, not google.protobuf.Struct — Struct
  // encodes every number as double and would turn a port 8080 into 8080.0
  // (see asc-platform/docs/features/app-settings.md).
  rpc GetAppSettings(GetAppSettingsRequest) returns (GetAppSettingsResponse);
  // Full-map replacement, same contract as PUT /v1/apps/{id}/settings: a key
  // absent from values_json resets to the package default.
  rpc SetAppSettings(SetAppSettingsRequest) returns (SetAppSettingsResponse);
  // A repository's available versions (its git tags, newest first) without
  // installing or cloning anything — one `git ls-remote` round trip. Used by
  // a version picker: the install wizard (before the app exists) and the
  // upgrade dropdown (an already-installed app) both resolve to a git URL
  // and call this the same way.
  rpc ListAppVersions(ListAppVersionsRequest) returns (ListAppVersionsResponse);
  // What a package repository actually ships, read before installing
  // anything (DMN-098): one application (asc.yaml) or a stack of them
  // (asc.stack.yaml), with the stack's apps, their dependencies and their
  // declared requirements. The daemon clones the repository shallowly into a
  // temporary directory and throws it away — nothing is installed and no app
  // directory is created. An install dialog calls this to show what it is
  // about to put on the node.
  rpc InspectPackage(InspectPackageRequest) returns (InspectPackageResponse);
  // Move an installed app to another version (DMN-053/DMN-056): `spec` is
  // its id or custom name, optionally `@version` (omitted = the repository's
  // newest tag). The app must already be stopped — same precondition as the
  // CLI's `asc app upgrade`; a caller that wants to upgrade a running app
  // stops it first (StopApp) and restarts it after (StartApp).
  rpc UpgradeApp(UpgradeAppRequest) returns (UpgradeAppResponse);
  // Same upgrade, as a live progress feed instead of one blocking call
  // (mirrors InstallAppStream/DMN-090): a text line per step of the
  // repository clone / image pull, ending with the same result UpgradeApp
  // would have returned — or, on failure, the stream ends with the same
  // error status. A disconnected caller does not cancel the upgrade.
  rpc UpgradeAppStream(UpgradeAppRequest) returns (stream UpgradeAppEvent);
  // Full copy of an installed app under a new id (DMN-019/DMN-113): the
  // repository, config and data are copied byte for byte, then a runtime is
  // freshly provisioned from the copy — a clone always starts stopped,
  // regardless of the source's state. Docker containers/systemd units
  // cannot be copied, only recreated from the copied manifest and settings.
  rpc CloneApp(CloneAppRequest) returns (CloneAppResponse);
  // Same clone, as a live progress feed instead of one blocking call
  // (mirrors InstallAppStream/DMN-090): a text line as the directory copy
  // progresses, ending with the same result CloneApp would have returned —
  // or, on failure, the stream ends with the same error status. A
  // disconnected caller does not cancel the clone.
  rpc CloneAppStream(CloneAppRequest) returns (stream CloneAppEvent);
}

enum AppState {
  APP_STATE_UNSPECIFIED = 0;
  APP_STATE_RUNNING = 1;
  APP_STATE_STOPPED = 2;
}

message App {
  string id = 1;
  string name = 2;
  // Runtime kind: docker | systemd | process.
  string kind = 3;
  AppState state = 4;
  string version = 5;
  // Package origin: "<source>:<git url>".
  string source = 6;
  // Owning Linux user name.
  string owner = 7;
  // The package title when the app carries a custom name (then `name` is
  // the custom name); absent otherwise.
  optional string title = 8;
  // Resource quota limits, when any are set (DMN-021).
  optional AppQuota quota = 9;
  // Stable instance identity generated at install (DMN-044); absent for apps
  // installed before it. Unlike `id`, never reused after removal.
  optional string uuid = 10;
  // Full commit sha the repository is currently checked out at (DMN-0XX),
  // read live from the app's own `repository/` clone — not persisted in
  // meta.json. Absent when it cannot be read (not a git repository, or an
  // app installed before this field existed still resolves fine, just
  // without a commit to show).
  optional string commit = 11;
  // Recorded package reference: "<stack>/<app>" for a stack member,
  // "<package>" (with no slash) for a standalone install — see
  // AppMeta.package and `asc stacks`' own use of the same field. Absent for
  // an app installed before DMN-033. A "/" here is what NODE-045's transfer
  // checks phase uses to refuse moving a single stack member.
  optional string package = 12;
  // In-repository subdirectory of the manifest (DMN-096) — a direct git
  // install of a monorepo package only; absent for a registry install
  // (whose entry carries its own path) or a repository with the manifest at
  // its root. NODE-045's transfer install phase needs this to reinstall a
  // direct monorepo install identically on the target.
  optional string repo_path = 13;
  // The branch a direct git install tracks across upgrades (DMN-053);
  // absent for a tag-pinned install (every registry install, and a direct
  // install of a specific tag). NODE-045's transfer install phase passes
  // this through so the target keeps tracking the same branch instead of
  // resolving to the default branch HEAD.
  optional string branch = 14;
}

// Per-app resource limits; every field is optional — only set limits appear.
message AppQuota {
  optional double cpu_cores = 1;
  optional uint64 ram_bytes = 2;
  optional uint64 disk_bytes = 3;
}

message ListAppsRequest {}

message ListAppsResponse {
  repeated App apps = 1;
}

message GetAppRequest {
  string id = 1;
}

message GetAppResponse {
  App app = 1;
}

message GetAppDiskRequest {
  string id = 1;
}

message GetAppDiskResponse {
  // Everything under the app directory (repository + data + config + any
  // private volume folders) — what the quota measures.
  uint64 app_dir_bytes = 1;
  // From asc.settings.yaml quota.max_disk, normalized to bytes.
  optional uint64 quota_bytes = 2;
  // Docker image size; absent for non-Docker apps or an unpulled image.
  optional uint64 image_bytes = 3;
  uint64 repository_bytes = 4;
  uint64 data_bytes = 5;
  // Custom volumes only — the default private volume is covered by
  // data_bytes.
  repeated AppVolumeUsage volumes = 6;
  // Absolute path of the app's own directory on this node
  // (`<apps_dir>/<id>`). Additive field for DMN-086: the platform's
  // apps-root is never published on its own, and an app-scoped file
  // manager needs this as a confinement root.
  string app_dir = 7;
}

message GetAppImageRequest {
  string id = 1;
  // Ask the registry for the tag's current digest (a bounded network call).
  bool check_remote = 2;
}

enum ImageUpdateState {
  IMAGE_UPDATE_STATE_UNSPECIFIED = 0;
  // The local image is what the registry serves, and the container runs it.
  IMAGE_UPDATE_STATE_UP_TO_DATE = 1;
  // The registry serves a different image for the tag.
  IMAGE_UPDATE_STATE_UPDATE_AVAILABLE = 2;
  // A newer image is already on the host; a restart applies it.
  IMAGE_UPDATE_STATE_RESTART_REQUIRED = 3;
  // Locally built, not pulled yet, or the registry could not be asked.
  IMAGE_UPDATE_STATE_UNKNOWN = 4;
}

message GetAppImageResponse {
  // Effective image reference; absent for a non-Docker app.
  optional string image = 1;
  // Absent for a digest reference.
  optional string tag = 2;
  // Built from the package's Dockerfile rather than pulled (DMN-050).
  bool built_locally = 3;
  // RepullApp applies: a registry image under the `latest` tag.
  bool repullable = 4;
  // sha256 id the tag points at on the host; absent when not pulled.
  optional string image_id = 5;
  // Registry manifest digest of the local image.
  optional string digest = 6;
  // org.opencontainers.image.version label, else a non-latest tag.
  optional string version = 7;
  // Unix seconds the image was built.
  optional int64 created = 8;
  // Id of the image the container was created from.
  optional string running_image_id = 9;
  // What the registry serves for the tag now (check_remote only).
  optional string remote_digest = 10;
  // Why the registry could not be asked.
  optional string remote_error = 11;
  ImageUpdateState state = 12;
}

message RepullAppRequest {
  string id = 1;
}

message RepullAppResponse {
  string image = 1;
  // Id the tag points at after the pull.
  string image_id = 2;
  // Id the container ran before.
  optional string previous_image_id = 3;
  // The pull brought a different image.
  bool updated = 4;
  // The app was running and has been restarted onto the new image.
  bool restarted = 5;
}

message AppVolumeUsage {
  // The raw asc.settings.yaml volume entry.
  string entry = 1;
  // Resolved host path, or the Docker volume name when it has no
  // mountpoint yet.
  string path = 2;
  // Absent when the size could not be determined.
  optional uint64 bytes = 3;
  // A Docker named volume — may be mounted by other apps too.
  bool shared = 4;
  // Whether `bytes` is already included in app_dir_bytes.
  bool counted = 5;
}

message InstallAppRequest {
  // "name", "stack" or "stack/app", optionally with "@version"
  // (version = git tag of the package repo), or a direct git repository
  // URL (https://, ssh:// or git@host:path — DMN-040).
  string spec = 1;
  // Registry source to install from; empty = automatic. Required when
  // several sources provide the package (the error lists them).
  string source = 2;
  // Custom app name (DMN-024); for a stack — the per-app name prefix.
  optional string name = 3;
  // Branch or tag to check out — direct repository installs only.
  optional string branch = 4;
  optional string tag = 5;
  // Consent to the package license (DMN-028). Without it a repository
  // shipping a LICENSE fails with the structured license error.
  bool license_ack = 6;
  // In-repository subdirectory of the manifest (DMN-096) — a direct git
  // install only, for monorepo packages whose asc.yaml is not at the
  // repository root (e.g. a registry entry's source.path). Ignored for a
  // registry spec, which resolves its own path from the registry entry.
  optional string path = 7;
  // One app of a stack to install instead of every non-optional one
  // (DMN-097) — a direct git install only: a registry spec addresses the
  // same thing as "<stack>/<app>". A direct install without it installs
  // every non-optional app of the stack the repository turns out to ship.
  optional string stack_app = 8;
  // Skip the resource shortfall check (DMN-099): without it, an install the
  // host cannot currently cover fails with requirements_not_met below
  // instead of running into a raw container-create failure. Does not affect
  // the CPU quota clamp, which always applies — the Engine rejects a quota
  // above the host's total core count outright, consent or not.
  bool force = 9;
  // Install as one of InspectPackageResponse.methods instead of the
  // package's own asc.yaml (DMN-107) — a direct git install only, since a
  // registry entry is always its own asc.yaml/asc.stack.yaml. Unset,
  // ASC_MANIFEST and ASC_STACK all mean "read the manifest normally";
  // DOCKER_COMPOSE/SWARM/KUBERNETES/HELM are rejected (not installable yet —
  // see InstallMethodKind).
  optional InstallMethodKind install_method = 10;
}

message InstallAppResponse {
  // Installed app id; for stack installs — the stack name.
  string id = 1;
  // Installed version; for stack installs — the version of the first app.
  string version = 2;
  // Stack installs: every freshly installed app, in dependency order.
  repeated InstalledApp apps = 3;
  // Stack installs: apps that were already installed and were skipped.
  repeated string skipped = 4;
  // Set instead of every field above when the repository ships a LICENSE
  // and the caller did not pass license_ack (DMN-028/DMN-091): the caller
  // renders its own consent dialog from these fields and retries with
  // license_ack = true. Not a gRPC error — the call otherwise succeeded, it
  // just needs one more round trip.
  optional LicenseRequiredDetail license_required = 5;
  // Set instead of every field above when the host cannot currently cover
  // the package's declared requirements or runtime quota and the caller did
  // not pass force (DMN-099): the caller renders its own "not enough
  // resources, install anyway?" screen and retries with force = true. Not a
  // gRPC error, same reasoning as license_required.
  optional RequirementsNotMetDetail requirements_not_met = 6;
  // Set instead of every field above when a direct git install's repository
  // is private and nothing the caller configured opens it (DMN-062/DMN-106)
  // — same non-error shape as license_required/requirements_not_met above.
  // A registry spec never sets this: BrowseAppRegistry already requires the
  // index itself to be public.
  optional AuthRequiredDetail auth_required = 7;
}

// See InstallAppResponse.license_required. Mirrors pkg::LicenseRequired
// field-for-field (asc-daemon/src/daemon/pkg/install.rs).
message LicenseRequiredDetail {
  string package = 1;
  string source = 2;
  string git = 3;
  string license = 4;
}

// See InstallAppResponse.requirements_not_met. Mirrors
// pkg::resources::RequirementsNotMet field-for-field.
message RequirementsNotMetDetail {
  string app = 1;
  repeated ResourceShortage shortages = 2;
}

// One resource the host falls short on, as "need > have": RAM/disk in
// human-readable sizes ("4.0 GiB"), CPU in cores ("2").
message ResourceShortage {
  // "RAM", "disk" or "CPU".
  string resource = 1;
  string need = 2;
  string have = 3;
}

// One event of an InstallAppStream call: either one more line of progress
// text, or the terminal result — the same InstallAppResponse the unary
// InstallApp call returns (including the license_required branch). A stream
// that ends without a `result` event ended in a genuine error instead; the
// gRPC status carries the reason, same as InstallApp.
message InstallAppEvent {
  oneof event {
    string line = 1;
    InstallAppResponse result = 2;
  }
}

message InstalledApp {
  string id = 1;
  string version = 2;
}

message ListAppVersionsRequest {
  // https://, http://, ssh://, or the scp-like git@host:path form — same
  // forms InstallAppRequest.spec accepts for a direct git install.
  string git_url = 1;
}

message ListAppVersionsResponse {
  // Git tags, newest version first (semver-descending).
  repeated string tags = 1;
  // The tag InstallApp/UpgradeApp would pick with no version given; absent
  // when the repository has no tags.
  optional string latest = 2;
}

message InspectPackageRequest {
  // Repository to read — the same URL forms InstallAppRequest.spec accepts
  // for a direct git install.
  string git_url = 1;
  // Ref to read the package at; neither = the default branch HEAD.
  optional string branch = 2;
  optional string tag = 3;
  // Manifest subdirectory inside the repository (a monorepo package, e.g. a
  // registry entry's source.path); absent = the repository root.
  optional string path = 4;
}

message InspectPackageResponse {
  // What the package is; apps leave `apps` empty, stacks leave
  // `requirements` unset (their apps carry their own).
  PackageKind kind = 1;
  // The app's own name, or the stack's.
  string name = 2;
  string version = 3;
  optional string title = 4;
  optional string description = 5;
  PackageRequirements requirements = 6;
  // Stack packages: the apps it ships, in manifest order.
  repeated StackApp apps = 7;
  // Every installation method detected in the repository (DMN-106),
  // regardless of `kind` above — a repository can carry asc.yaml next to a
  // Dockerfile it doesn't need, and that is still worth reporting. Empty
  // when auth_required is set: nothing could be cloned to detect anything.
  repeated DetectedInstallMethod methods = 8;
  // Set instead of every field above (kind stays PACKAGE_KIND_UNSPECIFIED,
  // methods stays empty) when the repository is private and nothing the
  // caller configured opens it (DMN-062) — the same non-error, "one more
  // round trip" shape as license_required on InstallAppResponse. Before this
  // field existed the gRPC layer had no downcast for pkg::auth::AuthRequired
  // and this case surfaced as a bare INTERNAL status.
  optional AuthRequiredDetail auth_required = 9;
}

enum PackageKind {
  // Neither asc.yaml nor asc.stack.yaml is present (DMN-106) — the
  // repository may still be installable some other way, see
  // InspectPackageResponse.methods.
  PACKAGE_KIND_UNSPECIFIED = 0;
  // asc.yaml — one application.
  PACKAGE_KIND_APP = 1;
  // asc.stack.yaml — several applications shipped together.
  PACKAGE_KIND_STACK = 2;
}

// DMN-106: what pkg::detect can find in a repository, beyond ASC's own
// manifest/stack. Detection and install support are two different
// questions — Swarm/Kubernetes/Helm are always `supported = false` today,
// reported so the operator sees "found, not supported" instead of the
// repository looking unrecognized.
enum InstallMethodKind {
  INSTALL_METHOD_KIND_UNSPECIFIED = 0;
  INSTALL_METHOD_KIND_ASC_MANIFEST = 1;
  INSTALL_METHOD_KIND_ASC_STACK = 2;
  INSTALL_METHOD_KIND_DOCKER_COMPOSE = 3;
  INSTALL_METHOD_KIND_DOCKERFILE = 4;
  INSTALL_METHOD_KIND_SWARM = 5;
  INSTALL_METHOD_KIND_KUBERNETES = 6;
  INSTALL_METHOD_KIND_HELM = 7;
}

message DetectedInstallMethod {
  InstallMethodKind kind = 1;
  // Paths relative to the package directory (the repository root, or its
  // manifest subdirectory for a monorepo package) that triggered detection.
  repeated string files = 2;
  bool supported = 3;
  // Set when supported is false; empty otherwise. Plain English — this is
  // API data for the platform's own localized UI, not CLI output, so it
  // does not go through the daemon's i18n system.
  string unsupported_reason = 4;
  // Compose/Swarm service names, or Kubernetes `kind` values found — empty
  // for methods with nothing further to summarize.
  repeated string items = 5;
}

// See InspectPackageResponse.auth_required / InstallAppResponse.auth_required.
message AuthRequiredDetail {
  // The URL the caller passed, unmodified.
  string url = 1;
  // pkg::auth::normalize(url) — the host/prefix a credential must be
  // configured for (REG-007's OrgCredential.pattern speaks the same
  // language, so the platform can offer "add a credential for this pattern"
  // directly).
  string pattern = 2;
  // "https" or "ssh" (pkg::auth::is_ssh_url(url)) — which credential shape
  // (token vs. SSH key) actually authorizes this URL.
  string transport = 3;
}

message StackApp {
  // Name within the stack — what InstallAppRequest.stack_app takes.
  string name = 1;
  // The id the app installs under: the name from its own asc.yaml, which is
  // not the stack-local one ("server" of the "cs2" stack → "cs2-server").
  string app_id = 2;
  string version = 3;
  optional string title = 4;
  optional string description = 5;
  // Skipped on a whole-stack install unless requested by name.
  bool optional = 6;
  // Apps of the same stack installed (and started) before this one.
  repeated string depends_on = 7;
  PackageRequirements requirements = 8;
}

// Minimum resources a package declares for itself (asc.yaml `requirements`);
// absent fields are simply not declared.
message PackageRequirements {
  // Size strings as written in the manifest: "4G", "512M".
  optional string ram = 1;
  optional string disk = 2;
  optional double cpu = 3;
}

message UpgradeAppRequest {
  // App id or custom name, optionally with "@version" (a git tag); no
  // version = the repository's newest tag.
  string spec = 1;
}

message UpgradeAppResponse {
  string id = 1;
  // The version that was installed before the upgrade; absent for an app
  // with no recorded version (a moving ref with no tags).
  optional string from = 2;
  string to = 3;
  // Full commit shas before/after (DMN-056) — the version alone does not
  // identify what was actually installed for an app that follows a branch,
  // and a re-tagged release moves a tag onto another commit.
  optional string from_commit = 4;
  optional string to_commit = 5;
  // True when the app was already at the requested (or newest) version —
  // `from`/`to_commit` etc. above still describe the version left in place.
  bool up_to_date = 6;
}

// One event of an UpgradeAppStream call: either one more line of progress
// text, or the terminal result — the same UpgradeAppResponse the unary
// UpgradeApp call returns. A stream that ends without a `result` event ended
// in a genuine error instead; the gRPC status carries the reason.
message UpgradeAppEvent {
  oneof event {
    string line = 1;
    UpgradeAppResponse result = 2;
  }
}

message CloneAppRequest {
  // The source app's id or custom name — same reference
  // AppManager::get_authorized accepts everywhere else.
  string id = 1;
  // Custom name for the clone; absent — the new id (DMN-033 numbering,
  // <source>-N) doubles as the display name.
  optional string name = 2;
}

message CloneAppResponse {
  // The clone's id.
  string id = 1;
  optional string name = 2;
  // Bytes copied from the source's repository/config/data.
  uint64 copied_bytes = 3;
}

// One event of a CloneAppStream call: either one more line of progress
// text, or the terminal result — the same CloneAppResponse the unary
// CloneApp call returns. A stream that ends without a `result` event ended
// in a genuine error instead; the gRPC status carries the reason.
message CloneAppEvent {
  oneof event {
    string line = 1;
    CloneAppResponse result = 2;
  }
}

message RenameAppRequest {
  string id = 1;
  // New custom name; empty resets to the package's own name.
  string name = 2;
}

message RenameAppResponse {
  App app = 1;
}

message StartAppRequest {
  string id = 1;
}

message StartAppResponse {
  // True when the app was already running (idempotent call).
  bool already_running = 1;
}

message StopAppRequest {
  string id = 1;
}

message StopAppResponse {
  bool already_stopped = 1;
}

message RestartAppRequest {
  string id = 1;
}

message RestartAppResponse {}

message GetAppLogsRequest {
  string id = 1;
  // Number of trailing lines; 0 means the server default (100).
  uint32 tail = 2;
  // When set, each line is prefixed with an ISO-8601 timestamp and a space
  // (DMN-088) — RFC3339Nano/UTC for docker apps, journalctl's short-iso for
  // systemd ones. process apps have no timestamp source and ignore this.
  bool timestamps = 3;
}

message GetAppLogsResponse {
  string logs = 1;
}

message RemoveAppRequest {
  string id = 1;
}

message RemoveAppResponse {}

enum ConsoleSessionType {
  CONSOLE_SESSION_TYPE_UNSPECIFIED = 0;
  // Read-only log stream.
  CONSOLE_SESSION_TYPE_LOGS = 1;
  // Interactive attach (stdin/stdout).
  CONSOLE_SESSION_TYPE_ATTACH = 2;
  // Interactive shell inside a running container — docker apps only
  // (DMN-082). Frames on this session are tagged (0x00 data, 0x01 resize:
  // big-endian u16 cols then u16 rows), unlike LOGS/ATTACH which are not.
  CONSOLE_SESSION_TYPE_EXEC = 3;
}

message IssueConsoleTokenRequest {
  string app_id = 1;
  ConsoleSessionType session = 2;
  // EXEC only: the command to run. Empty asks the daemon to probe a shell
  // (/bin/bash, falling back to /bin/sh).
  repeated string command = 3;
}

message IssueConsoleTokenResponse {
  string token = 1;
  // Unix seconds when the token expires (~30s TTL, single use).
  int64 expires_at = 2;
}

message GetAppStatsRequest {
  // Apps to sample. Empty means every app the caller can see (like `asc
  // stats` with no argument) — filtering happens here, before the shared
  // sampling window runs, not by discarding rows from a full-fleet sample.
  repeated string ids = 1;
}

message GetAppStatsResponse {
  repeated AppStatsSample apps = 1;
}

message StreamAppStatsRequest {
  // Same semantics as GetAppStatsRequest.ids.
  repeated string ids = 1;
  // Minimum seconds between pushed samples. 0 asks for the server default;
  // the server enforces a floor above 0 regardless (one sampling window
  // already costs ~500ms).
  uint32 min_interval_secs = 2;
}

// One app's resource usage, mirroring `asc stats`/`AppStats` in the daemon.
// Every optional field is unset (not zero) when the app is stopped or its
// runtime cannot report that counter — systemd/process apps have no network
// namespace of their own, so net_* is always unset for them.
message AppStatsSample {
  string app_id = 1;
  // CPU share since the previous internal reading; can exceed 100 on a
  // multi-core host, like `docker stats`.
  optional double cpu_percent = 2;
  optional uint64 memory_bytes = 3;
  optional uint64 disk_read_bytes = 4;
  optional uint64 disk_write_bytes = 5;
  optional uint64 net_rx_bytes = 6;
  optional uint64 net_tx_bytes = 7;
  // Current throughput, bytes/sec — the delta of the same two readings the
  // cumulative counters above and cpu_percent come from.
  optional double disk_read_rate = 8;
  optional double disk_write_rate = 9;
  optional double net_rx_rate = 10;
  optional double net_tx_rate = 11;
  // Everything under the app's directory — the same figure GetAppDisk
  // reports, computed without its image/volume breakdown so it stays cheap.
  uint64 disk_bytes = 12;
  optional uint64 quota_disk_bytes = 13;
  // Seconds since the app's current run started (DMN-089). Unset when
  // stopped or the runtime cannot report a start time.
  optional uint64 uptime_secs = 14;
}

enum PortProtocol {
  PORT_PROTOCOL_UNSPECIFIED = 0;
  PORT_PROTOCOL_TCP = 1;
  PORT_PROTOCOL_UDP = 2;
  // Both TCP and UDP, forwarded on the same port.
  PORT_PROTOCOL_BOTH = 3;
}

// One published port, host↔container remap included — `host == container`
// for a port published straight through.
message PublishedPort {
  uint32 host = 1;
  uint32 container = 2;
  PortProtocol protocol = 3;
}

message ListAppPortsRequest {
  string id = 1;
}

message ListAppPortsResponse {
  repeated PublishedPort ports = 1;
}

message GetAppSettingsRequest {
  string id = 1;
}

message GetAppSettingsResponse {
  // JSON-encoded SettingsFile (asc.settings.yaml); absent when the package
  // declares no settings.
  optional string settings_json = 1;
  // JSON object of the chosen values (defaults merged in), unmasked — the
  // daemon has no notion of "who is asking"; masking secrets on read is the
  // platform's nodeservice's job.
  string values_json = 2;
}

message SetAppSettingsRequest {
  string id = 1;
  string values_json = 2;
}

message SetAppSettingsResponse {
  // True when the app is currently running and its live container
  // configuration would now drift from these values — the caller should
  // offer a restart. False when the app is stopped (values simply apply on
  // the next start) or nothing changed.
  bool restart_required = 1;
}

// Registry sources pushed by the platform (DMN-083, REG-005): the
// organization-level source of truth for an org's registries lives on the
// platform; this service is how it lands in this node's own system-scope
// sources.toml. Every RPC here operates on Scope::System only — the
// platform never touches a Linux user's own ~/.config/asc/sources.toml,
// which stays under `asc source` CLI control.
service SourceService {
  rpc ListSources(ListSourcesRequest) returns (ListSourcesResponse);
  // Idempotent full replace of the system source list (see
  // SourceList::replace_all): `sources` becomes the entire list, deletions
  // included. Chosen over incremental add/remove RPCs because the platform
  // always knows its whole desired state and a partial-apply retry after a
  // dropped connection must not be possible.
  rpc ReplaceSources(ReplaceSourcesRequest) returns (ReplaceSourcesResponse);
}

message Source {
  string name = 1;
  string url = 2;
}

message ListSourcesRequest {}

message ListSourcesResponse {
  // System sources only, priority order; user-scope sources are invisible
  // here by design.
  repeated Source sources = 1;
}

message ReplaceSourcesRequest {
  // Complete desired system source list; empty clears every system source
  // (falls back to the synthesized "official" default).
  repeated Source sources = 1;
}

message ReplaceSourcesResponse {
  repeated Source sources = 1;
}

// Credential management (DMN-084/DMN-087). Unlike SourceService, this is
// targeted upsert/remove, not a full replace: /etc/asc/auth.json can carry
// Kind::Registry (docker image pull) credentials an operator added by hand
// for reasons unrelated to marketplace registries, and a bulk replace would
// stomp them.
//
// Two secret shapes: a token, or (DMN-087) raw PEM private-key bytes — the
// daemon writes the key to a 0600 file it owns under /etc/asc/ssh-keys and
// registers a Method::SshKey pointing at it, the same shape `asc auth add
// --ssh-key` produces by hand. The file is created with 0600 from the
// moment it exists (no readable-then-chmod window) and is removed again
// when the credential is replaced by something else or removed outright.
// Advertised as the separate "ssh-credentials" capability (GetStatus) so a
// platform talking to an older daemon can still push token credentials
// while skipping ssh-key ones with an explicit per-registry error instead
// of hitting UNIMPLEMENTED.
service CredentialService {
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse);
  // Upsert-by-(kind, pattern, app) — identical to GitAuth::add's existing
  // semantics; calling it again with the same triple replaces the secret,
  // token-for-token or key-for-key alike.
  rpc UpsertCredential(UpsertCredentialRequest) returns (UpsertCredentialResponse);
  rpc RemoveCredential(RemoveCredentialRequest) returns (RemoveCredentialResponse);
}

enum CredentialKind {
  CREDENTIAL_KIND_UNSPECIFIED = 0;
  CREDENTIAL_KIND_REPO = 1;
  CREDENTIAL_KIND_REGISTRY = 2;
}

// Never carries the secret — method_label mirrors Method::label() ("token"
// or "ssh-key <path>"), has_secret says whether one is configured (true for
// either method).
message CredentialSummary {
  CredentialKind kind = 1;
  string pattern = 2;
  optional string username = 3;
  optional string app = 4;
  string method_label = 5;
  bool has_secret = 6;
  // Absent for anything the operator configured by hand (`asc auth add`).
  // Set to "platform" for entries a platform push (REG-008) owns — see
  // UpsertCredentialRequest.managed_by (DMN-110).
  optional string managed_by = 7;
}

message ListCredentialsRequest {}

message ListCredentialsResponse {
  repeated CredentialSummary credentials = 1;
}

message UpsertCredentialRequest {
  CredentialKind kind = 1;
  // Host/prefix, or a full git URL to derive it from (GitAuth::normalize).
  string target = 2;
  oneof secret {
    string token = 3;
    // PEM-encoded (OpenSSH or PKCS8) private key bytes (DMN-087). The
    // daemon owns the file it ends up in — see the CredentialService
    // comment above.
    string ssh_private_key_pem = 6;
  }
  optional string username = 4;
  optional string app = 5;
  // Ownership marker (DMN-110): a platform push sets this to "platform" so a
  // later push can tell its own entries apart from ones the operator added
  // by hand and harvest only the former when they stop being sent. Absent —
  // the default for `asc auth add` — means "nobody manages this but the
  // operator"; such entries are never touched by RemoveCredential on their
  // behalf.
  optional string managed_by = 7;
}

message UpsertCredentialResponse {
  CredentialSummary credential = 1;
}

message RemoveCredentialRequest {
  optional CredentialKind kind = 1;
  string target = 2;
  // When set, only removes entries whose managed_by equals this value —
  // used by a platform harvest (DMN-110) so it can never delete an entry the
  // operator added by hand at the same (kind, pattern), even one the
  // operator bound to a different app than the platform's own entry.
  // Absent removes every matching entry regardless of ownership, same as
  // before this field existed (`asc auth remove`'s own behavior).
  optional string managed_by = 3;
}

message RemoveCredentialResponse {}

// System monitoring (DMN-006). The daemon samples metrics in the background
// (config `[monitor]`, default every 100ms — DMN-072) into an in-memory ring
// buffer; GetSystemMetrics/GetMetricsHistory read from that buffer, while
// StreamSystemMetrics subscribes to the live sampler directly. REST mirror:
// GET /v1/metrics, GET /v1/metrics/history?limit=N, GET /v1/network/interfaces.
service MonitorService {
  // Latest sample. Fails with UNAVAILABLE right after startup until the
  // first sample lands (typically < 1s).
  rpc GetSystemMetrics(GetSystemMetricsRequest) returns (GetSystemMetricsResponse);
  // Recent samples, oldest first.
  rpc GetMetricsHistory(GetMetricsHistoryRequest) returns (GetMetricsHistoryResponse);
  // Every sample as it is taken, pushed for as long as the caller keeps the
  // stream open. Callers that fall behind the sampler's broadcast buffer
  // just miss the oldest queued frames rather than stalling it (DMN-072).
  rpc StreamSystemMetrics(StreamSystemMetricsRequest) returns (stream SystemMetrics);
  // Every network interface on the machine, loopback included — an
  // inventory, not a metric: MAC, MTU, state and every IPv4/IPv6 address
  // (DMN-074).
  rpc ListNetworkInterfaces(ListNetworkInterfacesRequest) returns (ListNetworkInterfacesResponse);
  // Real host listening-port inventory (DMN-103) — what is actually bound,
  // parsed from /proc/net/{tcp,tcp6,udp,udp6}, not what an app's settings
  // merely declare (see AppService.ListAppPorts for that). Attribution to a
  // process is best-effort: a non-root caller over the unix socket simply
  // cannot read most other processes' fd tables, and the affected rows come
  // back with pid/process/command absent rather than the call failing.
  rpc ListListeningPorts(ListListeningPortsRequest) returns (ListListeningPortsResponse);
}

message ListListeningPortsRequest {}

message ListListeningPortsResponse {
  repeated ListeningPort ports = 1;
}

message ListeningPort {
  uint32 port = 1;
  // "tcp" or "udp".
  string protocol = 2;
  // "0.0.0.0", "::", "127.0.0.1" — the bind address exactly as /proc
  // reports it, not normalized or deduplicated across families.
  string address = 3;
  // "ipv4" or "ipv6".
  string family = 4;
  optional uint32 pid = 5;
  // /proc/<pid>/comm — short process name, absent when pid is absent.
  optional string process = 6;
  // /proc/<pid>/cmdline, argv joined with spaces; absent when pid is absent
  // or the process has already exited by the time it is read.
  optional string command = 7;
  // Set when a Docker container publishes this exact (port, protocol) —
  // resolved by cross-referencing DockerService.ListContainers, since
  // /proc alone cannot say which container owns a docker-proxy or dockerd
  // listener.
  optional string container_id = 8;
  optional string container_name = 9;
  // Set when the container above belongs to an installed ASC app.
  optional string app_id = 10;
  optional string app_uuid = 11;
  // Declared by an installed app'''s settings but nothing is bound right
  // now (the app is stopped) — resolved from AppService.ListAppPorts'''s
  // own source, not from /proc. Mutually exclusive with pid/container_id
  // being set: a declared-only row is never also a live one.
  bool declared_only = 12;
  // The daemon'''s own API listener ([api] listen / acme_http_listen).
  bool is_daemon = 13;
}

// Host processes (DMN-119): the inventory `ps`/`top` would show, read from
// /proc/<pid>/{stat,status,cmdline,cgroup}, and signal delivery. Advertised
// as the "processes" capability. REST mirror: GET /v1/processes,
// POST /v1/processes/{pid}/signal.
service ProcessService {
  // Every process on the host. Open to any caller — it is what `ps` shows
  // every local user. CPU usage is a delta against the previous call (from
  // anyone) when that was 0.2-60 s ago; a cold call samples for ~300 ms.
  rpc ListProcesses(ListProcessesRequest) returns (ListProcessesResponse);
  // Deliver a signal to one process. Root context only (on the unix socket;
  // the TCP listener always is). pid 1, the daemon itself and kernel threads
  // are refused with PERMISSION_DENIED; an unknown pid is NOT_FOUND; a pid
  // whose start time no longer matches expected_start_ticks (it exited and
  // the number was reused) is FAILED_PRECONDITION.
  rpc SignalProcess(SignalProcessRequest) returns (SignalProcessResponse);
}

message ListProcessesRequest {
  // Kernel threads (kthreadd and its children) are left out by default:
  // there are hundreds of them and nothing to do with them.
  bool include_kernel_threads = 1;
}

message ListProcessesResponse {
  repeated Process processes = 1;
  // MemTotal, so a caller can render rss as a share of the host.
  uint64 memory_total_bytes = 2;
  // Logical CPUs: the ceiling of cpu_percent is 100 * cpu_count.
  uint32 cpu_count = 3;
}

message Process {
  uint32 pid = 1;
  uint32 ppid = 2;
  // comm — at most 15 bytes, as the kernel truncates it.
  string name = 3;
  // argv joined with spaces, cut at 4096 characters; empty for kernel
  // threads and zombies.
  string command = 4;
  // Effective uid and its account name (the number when it has no passwd
  // entry).
  uint32 uid = 5;
  string user = 6;
  // Single-letter kernel state: R running, S sleeping, D uninterruptible,
  // Z zombie, T stopped, t traced, I idle, X dead.
  string state = 7;
  // top-style: 100 = one full core, so a multi-threaded process can exceed
  // 100 (ceiling 100 * cpu_count).
  double cpu_percent = 8;
  uint64 rss_bytes = 9;
  uint64 virtual_bytes = 10;
  uint32 threads = 11;
  int32 nice = 12;
  // Unix seconds; 0 when the boot time could not be read.
  int64 started_at = 13;
  // Raw starttime (clock ticks since boot): pass it back as
  // SignalProcessRequest.expected_start_ticks.
  uint64 start_ticks = 14;
  bool kernel_thread = 15;
  // The Docker container the process runs in (from its cgroup), and that
  // container's name when the Engine could be reached.
  optional string container_id = 16;
  optional string container_name = 17;
  // Set when that container is the runtime of an installed ASC app.
  optional string app_id = 18;
  optional string app_uuid = 19;
  // SignalProcess refuses this process (pid 1, the daemon, a kernel thread);
  // the reason is human-readable.
  optional string protected_reason = 20;
}

enum ProcessSignal {
  PROCESS_SIGNAL_UNSPECIFIED = 0;
  PROCESS_SIGNAL_TERM = 1;
  PROCESS_SIGNAL_KILL = 2;
  PROCESS_SIGNAL_HUP = 3;
  PROCESS_SIGNAL_INT = 4;
  PROCESS_SIGNAL_STOP = 5;
  PROCESS_SIGNAL_CONT = 6;
  PROCESS_SIGNAL_USR1 = 7;
  PROCESS_SIGNAL_USR2 = 8;
}

message SignalProcessRequest {
  uint32 pid = 1;
  ProcessSignal signal = 2;
  // Process.start_ticks as the caller saw it; strongly recommended — without
  // it a pid reused since the list was rendered gets the signal.
  optional uint64 expected_start_ticks = 3;
}

message SignalProcessResponse {}


message SystemMetrics {
  // Unix seconds when the sample was taken.
  int64 timestamp = 1;
  // Busy CPU share since the previous sample, 0-100. Absent on the very
  // first sample (usage is a delta of two readings).
  optional double cpu_usage_percent = 2;
  uint32 cpu_cores = 3;
  double load1 = 4;
  double load5 = 5;
  double load15 = 6;
  // Memory sizes in bytes; used = total - available.
  uint64 mem_total = 7;
  uint64 mem_used = 8;
  uint64 mem_available = 9;
  uint64 swap_total = 10;
  uint64 swap_used = 11;
  uint64 uptime_secs = 12;
  repeated DiskMetrics disks = 13;
  repeated NetworkMetrics network = 14;
  // Every GPU found on the machine; empty on a server without one.
  repeated GpuMetrics gpus = 15;
  // Per-device disk read/write throughput (DMN-073); empty when
  // /proc/diskstats cannot be read.
  repeated DiskIoMetrics disk_io = 16;
}

// One mounted real filesystem; sizes in bytes.
message DiskMetrics {
  string mount = 1;
  string filesystem = 2;
  uint64 total = 3;
  uint64 used = 4;
  // What unprivileged users can allocate (statvfs f_bavail).
  uint64 available = 5;
}

// One network interface (loopback excluded). Byte/error counters are
// cumulative since boot; per-second rates are deltas between samples.
message NetworkMetrics {
  string interface = 1;
  uint64 rx_bytes = 2;
  uint64 tx_bytes = 3;
  uint64 rx_errors = 4;
  uint64 tx_errors = 5;
  // Absent on the first sample.
  optional double rx_bytes_per_sec = 6;
  optional double tx_bytes_per_sec = 7;
}

// One block device from /proc/diskstats (whole disks only — partitions and
// loop/ram/zram devices are filtered out). Byte counters are cumulative
// since boot; per-second rates are deltas between samples, absent on the
// first one.
message DiskIoMetrics {
  string device = 1;
  uint64 read_bytes = 2;
  uint64 write_bytes = 3;
  optional double read_bytes_per_sec = 4;
  optional double write_bytes_per_sec = 5;
  // Milliseconds spent doing I/O, cumulative since boot (field 13 of
  // /proc/diskstats).
  uint64 io_ms = 6;
}

// One GPU. NVIDIA figures come from nvidia-smi, AMD ones from the amdgpu
// sysfs interface; fields a source cannot report are absent rather than zero.
message GpuMetrics {
  // Position in its vendor's enumeration (nvidia-smi index, DRM card number).
  uint32 index = 1;
  // "nvidia" or "amd".
  string vendor = 2;
  string name = 3;
  // Busy share of the graphics engine, 0-100.
  optional double utilization_percent = 4;
  // VRAM sizes in bytes.
  uint64 memory_total = 5;
  uint64 memory_used = 6;
  optional double temperature_c = 7;
  optional double power_watts = 8;
}

message GetSystemMetricsRequest {}

message GetSystemMetricsResponse {
  SystemMetrics metrics = 1;
}

message GetMetricsHistoryRequest {
  // Maximum number of most recent samples; 0 = the whole buffer.
  uint32 limit = 1;
}

message GetMetricsHistoryResponse {
  repeated SystemMetrics samples = 1;
}

message StreamSystemMetricsRequest {}

message ListNetworkInterfacesRequest {}

message ListNetworkInterfacesResponse {
  repeated NetworkInterface interfaces = 1;
}

// One network interface, loopback included. Metadata comes from
// /sys/class/net/<name>; addresses from the kernel's interface address list.
message NetworkInterface {
  string name = 1;
  // Empty for interfaces without a link-layer address (e.g. some tunnels).
  string mac = 2;
  uint32 mtu = 3;
  // "up" or "down", read from /sys/class/net/<name>/operstate.
  string state = 4;
  bool is_loopback = 5;
  repeated InterfaceAddress addresses = 6;
}

message InterfaceAddress {
  string address = 1;
  uint32 prefix_len = 2;
  // "ipv4" or "ipv6".
  string family = 3;
  // "host", "link", "global" etc. — RFC 3549 scope name, when known.
  string scope = 4;
}

// API tokens (DMN-065, DMN-066). Two kinds of bearer token guard this API:
// the long-lived **primary** in api.token — the credential the platform
// stores at enrollment, and from here on a refresh token — and short-lived
// **access** tokens minted from it, kept only in the daemon's memory.
//
// An access token carries the same authority as the primary for every other
// service; what it may not do is manage tokens. Every method below except
// GetTokenStatus therefore requires the primary and answers PERMISSION_DENIED
// otherwise. REST mirror: /v1/token, /v1/token/access, /v1/token/rotate.
service TokenService {
  // Mint a short-lived access token.
  rpc IssueAccessToken(IssueAccessTokenRequest) returns (IssueAccessTokenResponse);
  // Kill every live access token at once — the "a token leaked" button.
  // Also runs as the first step of RotatePrimaryToken.
  rpc RevokeAccessTokens(RevokeAccessTokensRequest) returns (RevokeAccessTokensResponse);
  // Replace the primary and return the new one in plaintext: a platform that
  // reaches the node directly has no other way to learn it.
  rpc RotatePrimaryToken(RotatePrimaryTokenRequest) returns (RotatePrimaryTokenResponse);
  // Confirm that the new primary is stored, ending the grace window early.
  // Must be called with the NEW token; the one it replaced is refused.
  rpc CommitPrimaryTokenRotation(CommitPrimaryTokenRotationRequest) returns (CommitPrimaryTokenRotationResponse);
  // Token state without any token material.
  rpc GetTokenStatus(GetTokenStatusRequest) returns (GetTokenStatusResponse);
}

enum DaemonTokenKind {
  DAEMON_TOKEN_KIND_UNSPECIFIED = 0;
  DAEMON_TOKEN_KIND_PRIMARY = 1;
  DAEMON_TOKEN_KIND_ACCESS = 2;
  // The unix socket: identity came from the kernel, not from a token.
  DAEMON_TOKEN_KIND_LOCAL = 3;
}

message IssueAccessTokenRequest {
  // Requested lifetime; clamped by the daemon. 0 = the default (600s).
  uint32 ttl_secs = 1;
  // Free-form note about who asked for it, for the daemon's own reporting.
  string label = 2;
}

message IssueAccessTokenResponse {
  // Plaintext token, returned exactly once and never readable again.
  string token = 1;
  // Unix seconds when it expires.
  int64 expires_at = 2;
  uint32 ttl_secs = 3;
}

message RevokeAccessTokensRequest {}

message RevokeAccessTokensResponse {
  uint32 revoked = 1;
}

message RotatePrimaryTokenRequest {
  // How long the previous primary keeps working, giving the caller time to
  // persist the new one. Unset = 300s, 0 = switch over immediately.
  optional uint32 grace_secs = 1;
}

message RotatePrimaryTokenResponse {
  string token = 1;
  int64 rotated_at = 2;
  // Unix seconds until which the previous token still authenticates; 0 when
  // the caller asked for no grace window.
  int64 grace_until = 3;
  uint32 revoked_access_tokens = 4;
}

message CommitPrimaryTokenRotationRequest {}

message CommitPrimaryTokenRotationResponse {}

message GetTokenStatusRequest {}

message GetTokenStatusResponse {
  // How the calling request authenticated.
  DaemonTokenKind kind = 1;
  // Unix seconds; set only when the caller presented an access token.
  int64 expires_at = 2;
  uint32 access_tokens_live = 3;
  // First 16 hex characters of the primary's SHA-256 — enough to answer "is
  // the token I hold still the current one" without transmitting it.
  string primary_digest = 4;
  bool rotation_pending = 5;
  int64 grace_until = 6;
  uint32 ttl_default_secs = 7;
}

// Node filesystem access (DMN-070). The daemon runs as root and the whole
// tree from "/" is in scope: the platform performs its own per-user
// authorization before it ever reaches here (see docs/api.md). Symlinks are
// reported but never traversed — a recursive operation stops at the link.
//
// Every request below also accepts an optional app_id (DMN-086): when set,
// the call is app-scoped instead of node-wide — every path is confined,
// daemon-side, to that app's directory and private volumes (with symlinks
// canonicalized so one planted inside the app cannot point back out of it),
// and the caller only needs to own the app rather than hold the node-wide
// files.* domain. See docs/files.md and
// asc-platform/docs/features/app-file-manager.md.
// Every method requires a root caller context; a non-root unix-socket peer is
// refused, unlike the rest of this API (see docs/files.md).
service FileService {
  rpc ListDirectory(ListDirectoryRequest) returns (ListDirectoryResponse);
  rpc StatPath(StatPathRequest) returns (StatPathResponse);
  rpc CreateDirectory(CreateDirectoryRequest) returns (CreateDirectoryResponse);
  // Rename and move are one operation: a rename is a move whose destination
  // shares the source's parent.
  rpc MovePath(MovePathRequest) returns (MovePathResponse);
  rpc CopyPath(CopyPathRequest) returns (CopyPathResponse);
  rpc DeletePaths(DeletePathsRequest) returns (DeletePathsResponse);
  rpc CreateArchive(CreateArchiveRequest) returns (CreateArchiveResponse);
  rpc ReadFile(ReadFileRequest) returns (stream FileChunk);
  rpc WriteFile(stream WriteFileRequest) returns (WriteFileResponse);
  // Change of mode and/or owner/group, chmod/chown-style: an unset field
  // leaves that attribute untouched.
  rpc SetPathAttributes(SetPathAttributesRequest) returns (SetPathAttributesResponse);
  // The machine's local users and groups (/etc/passwd, /etc/group), for a
  // UI to offer as a dropdown when reassigning ownership. Root-gated like
  // every other method here, not because the listing itself is sensitive —
  // every file's owner/group name is already visible through ListDirectory
  // — but for the same reason everything else in this service is: it is
  // not scoped per calling user.
  rpc ListSystemIdentities(ListSystemIdentitiesRequest) returns (ListSystemIdentitiesResponse);
}

enum FileKind {
  FILE_KIND_UNSPECIFIED = 0;
  FILE_KIND_FILE = 1;
  FILE_KIND_DIRECTORY = 2;
  FILE_KIND_SYMLINK = 3;
  // Socket, fifo, block/char device: listed, never opened.
  FILE_KIND_OTHER = 4;
}

// One directory entry as lstat sees it: a symlink is always SYMLINK, never
// the kind of what it points at.
message FileEntry {
  string name = 1;
  FileKind kind = 2;
  uint64 size = 3;
  // Unix seconds; 0 when unreadable.
  int64 modified_at = 4;
  // st_mode & 0o7777.
  uint32 mode = 5;
  uint32 uid = 6;
  uint32 gid = 7;
  // User/group name, falling back to the numeric id when unresolvable.
  string owner = 8;
  string group = 9;
  bool is_symlink = 10;
  // Raw readlink() value, unresolved. Set only when is_symlink is true.
  optional string symlink_target = 11;
  // stat() through the link; absent when is_symlink is false or the link is
  // broken.
  optional FileKind target_kind = 12;
}

message ListDirectoryRequest {
  // Absolute path.
  string path = 1;
  // Default false: dotfiles are omitted.
  bool include_hidden = 2;
  // App-scoped confinement (DMN-086): when set, `path` is confined to this
  // app's directory and private volumes, canonicalized and enforced
  // daemon-side — see app_id on FileService's other requests.
  optional string app_id = 3;
}

message ListDirectoryResponse {
  // What the daemon actually listed (equals the request path).
  string path = 1;
  // Directories first, then by name, case-insensitively.
  repeated FileEntry entries = 2;
  // True when the entry cap was hit — entries is a prefix, not the whole
  // directory.
  bool truncated = 3;
  uint64 total_entries = 4;
}

message StatPathRequest {
  string path = 1;
  // See ListDirectoryRequest.app_id.
  optional string app_id = 2;
}

message StatPathResponse {
  FileEntry entry = 1;
  string parent = 2;
}

message CreateDirectoryRequest {
  string path = 1;
  bool parents = 2;
  // See ListDirectoryRequest.app_id.
  optional string app_id = 3;
}

message CreateDirectoryResponse {
  FileEntry entry = 1;
}

message MovePathRequest {
  string source = 1;
  string destination = 2;
  bool overwrite = 3;
  // See ListDirectoryRequest.app_id. Confines both source and destination.
  optional string app_id = 4;
}

message MovePathResponse {
  FileEntry entry = 1;
}

message CopyPathRequest {
  string source = 1;
  string destination = 2;
  bool overwrite = 3;
  // See ListDirectoryRequest.app_id. Confines both source and destination.
  optional string app_id = 4;
}

message CopyPathResponse {
  FileEntry entry = 1;
  uint64 bytes_copied = 2;
  uint32 files_copied = 3;
}

message DeletePathsRequest {
  repeated string paths = 1;
  bool recursive = 2;
  // See ListDirectoryRequest.app_id. Confines every path.
  optional string app_id = 3;
}

// Best-effort per path, like backup pruning: one refusal does not abort the
// rest.
message DeletePathsResponse {
  uint32 deleted = 1;
  repeated DeleteFailure failures = 2;
}

message DeleteFailure {
  string path = 1;
  string error = 2;
}

enum ArchiveFormat {
  ARCHIVE_FORMAT_UNSPECIFIED = 0;
  ARCHIVE_FORMAT_TAR_GZ = 1;
  // Reserved: answers UNIMPLEMENTED until a zip encoder is worth the
  // dependency (see docs/files.md).
  ARCHIVE_FORMAT_ZIP = 2;
}

message CreateArchiveRequest {
  // Names are resolved relative to this directory.
  string directory = 1;
  // Basenames, never paths.
  repeated string names = 2;
  // Absolute destination for the archive file.
  string archive_path = 3;
  ArchiveFormat format = 4;
  // See ListDirectoryRequest.app_id. Confines both directory and
  // archive_path.
  optional string app_id = 5;
}

message CreateArchiveResponse {
  FileEntry entry = 1;
  uint64 bytes = 2;
  uint32 files = 3;
}

message ReadFileRequest {
  string path = 1;
  // Resume from this byte offset; 0 = from the start.
  uint64 offset = 2;
  // See ListDirectoryRequest.app_id.
  optional string app_id = 3;
}

message FileChunk {
  bytes data = 1;
  // First message only: what the daemon is about to send, so the caller can
  // set Content-Length and draw a real progress bar.
  optional uint64 total_size = 2;
}

message WriteFileHeader {
  string directory = 1;
  // Basename; the daemon joins it to directory itself — a name containing a
  // path separator is rejected.
  string name = 2;
  bool overwrite = 3;
  // Default 0644.
  optional uint32 mode = 4;
  optional uint64 expected_size = 5;
  // See ListDirectoryRequest.app_id. Confines directory.
  optional string app_id = 6;
}

message WriteFileRequest {
  // First message only.
  optional WriteFileHeader header = 1;
  bytes data = 2;
}

message WriteFileResponse {
  FileEntry entry = 1;
  uint64 bytes_written = 2;
}

message SetPathAttributesRequest {
  string path = 1;
  // st_mode & 0o7777; unset leaves the mode untouched.
  optional uint32 mode = 2;
  // User/group name from ListSystemIdentities, not a uid/gid: the caller is
  // a UI dropdown, not a script. Unset leaves that half of ownership
  // untouched — chown semantics, not "reset to root".
  optional string owner = 3;
  optional string group = 4;
  // See ListDirectoryRequest.app_id.
  optional string app_id = 5;
}

message SetPathAttributesResponse {
  FileEntry entry = 1;
}

message ListSystemIdentitiesRequest {}

message SystemUser {
  string name = 1;
  uint32 uid = 2;
  string home = 3;
}

message SystemGroup {
  string name = 1;
  uint32 gid = 2;
}

message ListSystemIdentitiesResponse {
  // Ordered by uid/gid ascending.
  repeated SystemUser users = 1;
  repeated SystemGroup groups = 2;
}

// Local Linux account management: list/create/delete accounts, lock/unlock,
// change shell and supplementary groups, and manage each account's
// `~/.ssh/authorized_keys`. Every method is root-gated like FileService —
// this is whole-machine account administration, not scoped per calling
// user. Account creation/deletion shells out to `useradd`/`userdel`
// (battle-tested distro tooling handles /etc/shadow, skeleton files and
// NSS consistently) rather than hand-editing /etc/passwd.
service UserService {
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  // Refuses uid 0 and any uid below 1000: this deletes a Linux account,
  // not a platform record, and system/service accounts are not this
  // feature's business.
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  rpc SetUserLocked(SetUserLockedRequest) returns (SetUserLockedResponse);
  rpc SetUserShell(SetUserShellRequest) returns (SetUserShellResponse);
  // Replaces the full supplementary group set, `UpdateNodeProjects`-style:
  // a partial add/remove API would let two operators silently clobber each
  // other's changes.
  rpc SetUserGroups(SetUserGroupsRequest) returns (SetUserGroupsResponse);
  rpc ListAuthorizedKeys(ListAuthorizedKeysRequest) returns (ListAuthorizedKeysResponse);
  // Idempotent: adding a key already present returns it unchanged instead
  // of duplicating the line.
  rpc AddAuthorizedKey(AddAuthorizedKeyRequest) returns (AddAuthorizedKeyResponse);
  rpc RemoveAuthorizedKey(RemoveAuthorizedKeyRequest) returns (RemoveAuthorizedKeyResponse);
}

message ManagedUser {
  string name = 1;
  uint32 uid = 2;
  uint32 gid = 3;
  string home = 4;
  string shell = 5;
  bool locked = 6;
  // uid < 1000 (or 0): surfaced for visibility, not hidden — but blocked
  // from DeleteUser and worth a UI badge.
  bool is_system = 7;
  // Supplementary groups only (not the primary gid), sorted by name.
  repeated string groups = 8;
}

message ListUsersRequest {}

message ListUsersResponse {
  // Ordered by uid ascending, root included.
  repeated ManagedUser users = 1;
}

message CreateUserRequest {
  string name = 1;
  // Default: /home/<name>.
  optional string home = 2;
  // Default: /bin/bash.
  optional string shell = 3;
  // Default true: `useradd -m` vs `-M`.
  optional bool create_home = 4;
  // Supplementary groups to add at creation time (e.g. sudo, docker) —
  // must already exist on the machine.
  repeated string groups = 5;
}

message CreateUserResponse {
  ManagedUser user = 1;
}

message DeleteUserRequest {
  string name = 1;
  // `userdel -r`: also remove the home directory and mail spool.
  bool remove_home = 2;
}

message DeleteUserResponse {}

message SetUserLockedRequest {
  string name = 1;
  bool locked = 2;
}

message SetUserLockedResponse {
  ManagedUser user = 1;
}

message SetUserShellRequest {
  string name = 1;
  // Must be an absolute path already present in /etc/shells.
  string shell = 2;
}

message SetUserShellResponse {
  ManagedUser user = 1;
}

message SetUserGroupsRequest {
  string name = 1;
  // Full replacement set; empty clears every supplementary group.
  repeated string groups = 2;
}

message SetUserGroupsResponse {
  ManagedUser user = 1;
}

message AuthorizedKey {
  // "SHA256:base64", from `ssh-keygen -lf`.
  string fingerprint = 1;
  // e.g. ssh-ed25519, ssh-rsa.
  string key_type = 2;
  // Trailing comment field of the line, if any.
  string comment = 3;
}

message ListAuthorizedKeysRequest {
  string user = 1;
}

message ListAuthorizedKeysResponse {
  // In file order.
  repeated AuthorizedKey keys = 1;
}

message AddAuthorizedKeyRequest {
  string user = 1;
  // Full "type base64 [comment]" line.
  string public_key = 2;
}

message AddAuthorizedKeyResponse {
  // The stored key; unchanged and returned as-is when already present.
  AuthorizedKey key = 1;
}

message RemoveAuthorizedKeyRequest {
  string user = 1;
  string fingerprint = 2;
}

message RemoveAuthorizedKeyResponse {}
// Everything on the node's Docker Engine — ASC-owned or not (DMN-102). A
// separate service rather than more methods on AppService: AppService is
// about *ASC applications*, this is host inventory, and the platform gates
// the whole family on one capability.
//
// Root context only. A container ASC did not create has no owner for
// AppManager::get_authorized to check against, so there is nothing to scope
// a non-root caller to — the same reasoning FileService uses.
//
// Lifecycle control (ControlContainer, DMN-111) covers containers ASC does
// *not* own only: an ASC app's container must not be stopped behind
// AppManager's back (desired_state would bring it straight back after a
// daemon restart, which reads as a bug), so those are refused with
// FAILED_PRECONDITION and controlled through AppService instead. Gated on the
// "docker.control" capability.
service DockerService {
  rpc ListContainers(ListContainersRequest) returns (ListContainersResponse);
  // Live resource usage of the requested containers (DMN-112), like
  // `docker stats --no-stream`. Kept separate from ListContainers because a
  // CPU percentage needs two readings ~500ms apart, and the container list
  // must not pay that cost every time it is opened — the same split
  // AppService.ListApps/GetAppStats already makes.
  rpc ListContainerStats(ListContainerStatsRequest) returns (ListContainerStatsResponse);
  // Host inventory beyond containers (DMN-104): every image, named volume
  // and network the Engine knows about, ASC-owned or not. Each image/volume
  // row says whether an installed app (running or not) still needs it, so a
  // cleanup UI can explain *why* something is protected before the caller
  // ever asks to remove anything.
  rpc ListImages(ListImagesRequest) returns (ListImagesResponse);
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse);
  // Networks are inventory-only here — never a prune target. See
  // PruneDocker and docs/english/app-management.md for why.
  rpc ListNetworks(ListNetworksRequest) returns (ListNetworksResponse);
  // `docker system df`'s four categories (images/containers/volumes/build
  // cache): counts and bytes, nothing else. Expensive — the Engine walks
  // every layer and volume to answer — so callers ask for it only when a
  // user opens the Docker settings section, never on a poll.
  rpc GetDockerDiskUsage(GetDockerDiskUsageRequest) returns (GetDockerDiskUsageResponse);
  // Remove unused images/volumes/build cache, one item at a time rather than
  // the Engine's own bulk prune endpoints (DMN-105): an item an installed
  // app still needs — running or stopped — is protected and reported in
  // `skipped` with why, never silently removed. `dry_run` computes the exact
  // same plan without deleting anything, so a caller can show it for
  // confirmation before the real call.
  rpc PruneDocker(PruneDockerRequest) returns (PruneDockerResponse);
  // Start/stop/restart/pause/unpause/remove one container, or every
  // container of one compose project (DMN-111). A container belonging to an
  // installed ASC app — its own container, or any container of its compose
  // project — is refused with FAILED_PRECONDITION before anything is touched.
  // For a compose project, members the action does not apply to (stopping an
  // already exited service) are skipped rather than failing the call;
  // start-like actions walk the project oldest-first, stop-like ones
  // newest-first.
  rpc ControlContainer(ControlContainerRequest) returns (ControlContainerResponse);
}

enum ContainerAction {
  CONTAINER_ACTION_UNSPECIFIED = 0;
  CONTAINER_ACTION_START = 1;
  CONTAINER_ACTION_STOP = 2;
  CONTAINER_ACTION_RESTART = 3;
  CONTAINER_ACTION_PAUSE = 4;
  CONTAINER_ACTION_UNPAUSE = 5;
  // Force-remove (`docker rm -f`): a running container is stopped first.
  // Volumes are never removed.
  CONTAINER_ACTION_REMOVE = 6;
}

message ControlContainerRequest {
  oneof target {
    // Full id, unambiguous id prefix, or name.
    string container = 1;
    // com.docker.compose.project of the stack to act on as a whole.
    string compose_project = 2;
  }
  ContainerAction action = 3;
}

message ControlContainerResponse {
  // Names of the containers actually acted on, in the order they were.
  repeated string affected = 1;
}

message ListContainersRequest {
  // False = running containers only, like `docker ps`.
  bool all = 1;
  // Ask the Engine for SizeRw/SizeRootFs (`docker ps -s`). Off by default:
  // it makes the Engine walk every container's writable layer, which is a
  // visible pause on a node with dozens of containers and pointless for a
  // caller that only wants the list.
  bool with_size = 2;
}

message ListContainersResponse {
  repeated Container containers = 1;
}

message Container {
  // Full 64-hex id, never the short form: the caller decides how to abbreviate.
  string id = 1;
  // Container names with the Engine's leading '/' stripped.
  repeated string names = 2;
  string image = 3;
  string image_id = 4;
  // created | running | paused | restarting | removing | exited | dead.
  // Free-form on purpose — the Engine's vocabulary is not ours to freeze.
  string state = 5;
  // Human-readable Engine status line ("Up 3 hours", "Exited (0) 2 days ago").
  string status = 6;
  // Creation time, unix seconds.
  int64 created = 7;
  repeated ContainerPort ports = 8;
  map<string, string> labels = 9;
  // Set when this container belongs to an installed ASC app. Resolved by
  // matching the container name against the app's own AppMeta.runtime, never
  // by parsing the "asc-" prefix out of the name: that prefix is a naming
  // convention, not a claim of ownership, and an operator can name anything
  // that way.
  optional string app_id = 10;
  optional string app_uuid = 11;
  // com.docker.compose.project / .service, lifted out of `labels` so callers
  // do not have to know how Compose spells its own keys.
  optional string compose_project = 12;
  optional string compose_service = 13;
  // Writable-layer and total sizes; only set when with_size was requested.
  optional uint64 size_rw = 14;
  optional uint64 size_root_fs = 15;
  // Names of the networks the container is attached to.
  repeated string networks = 16;
}

message ContainerPort {
  uint32 private_port = 1;
  // Absent for a port that is exposed but not published to the host.
  optional uint32 public_port = 2;
  // tcp | udp | sctp.
  string protocol = 3;
  // Host bind address of a published port ("0.0.0.0", "::", "127.0.0.1").
  string ip = 4;
}

message ListContainerStatsRequest {
  // Container ids or names; empty = every running container. Applied
  // *before* the sampling window, not after — asking for one container must
  // not cost the sampling time of every container on the node.
  repeated string ids = 1;
}

message ListContainerStatsResponse {
  // One entry per container that was still alive for both readings. A
  // container that disappeared mid-sample is simply absent: that is an
  // ordinary race, not a failure of the call.
  repeated ContainerStats stats = 1;
}

message ContainerStats {
  // Full id, matching Container.id.
  string id = 1;
  // Percent of one host CPU, like `docker stats` — can exceed 100 on a
  // multi-core host.
  double cpu_percent = 2;
  uint64 memory_bytes = 3;
  // 0 when the container has no memory limit.
  uint64 memory_limit_bytes = 4;
  uint64 network_rx_bytes = 5;
  uint64 network_tx_bytes = 6;
  uint64 block_read_bytes = 7;
  uint64 block_write_bytes = 8;
}

// ── Host inventory & cleanup (DMN-104/DMN-105) ──────────────────────────────

message ListImagesRequest {}

message ListImagesResponse {
  repeated DockerImage images = 1;
}

message DockerImage {
  // Full "sha256:..." id.
  string id = 1;
  // "name:tag" references pointing at this image; empty for a dangling
  // image (no tag references it any more — `docker images -f dangling=true`).
  repeated string tags = 2;
  uint64 size_bytes = 3;
  int64 created = 4;
  map<string, string> labels = 5;
  bool dangling = 6;
  // An installed app (running or not) still runs this image — PruneDocker
  // never removes it, dry_run or not.
  bool asc_protected = 7;
  // Set together with asc_protected: which app, for the UI to explain the
  // lock without a separate lookup.
  optional string protected_reason = 8;
}

message ListVolumesRequest {}

message ListVolumesResponse {
  repeated DockerVolume volumes = 1;
}

message DockerVolume {
  string name = 1;
  string driver = 2;
  string mountpoint = 3;
  optional int64 created_at = 4;
  map<string, string> labels = 5;
  // Containers currently referencing this volume; absent when the Engine
  // did not report usage data for it.
  optional int32 ref_count = 6;
  optional uint64 size_bytes = 7;
  // An installed app (running or not) declares this named volume — see
  // DockerImage.asc_protected for the same contract.
  bool asc_protected = 8;
  optional string protected_reason = 9;
}

message ListNetworksRequest {}

message ListNetworksResponse {
  repeated DockerNetwork networks = 1;
}

// Inventory-only — see PruneDocker for why networks are never a prune
// target.
message DockerNetwork {
  string id = 1;
  string name = 2;
  string driver = 3;
  // "local" or "swarm".
  string scope = 4;
  bool internal = 5;
  optional int64 created = 6;
  map<string, string> labels = 7;
}

message GetDockerDiskUsageRequest {}

message GetDockerDiskUsageResponse {
  DiskUsageGroup images = 1;
  DiskUsageGroup containers = 2;
  DiskUsageGroup volumes = 3;
  DiskUsageGroup build_cache = 4;
}

// One `docker system df` category — counts and bytes, exactly as the Engine
// reports them (no `layers_size`: the Engine's own `/system/df` response has
// no such top-level field — see bollard's SystemDataUsageResponse).
message DiskUsageGroup {
  int64 active_count = 1;
  int64 total_count = 2;
  uint64 size_bytes = 3;
  uint64 reclaimable_bytes = 4;
}

enum PruneTarget {
  PRUNE_TARGET_UNSPECIFIED = 0;
  PRUNE_TARGET_IMAGES = 1;
  PRUNE_TARGET_VOLUMES = 2;
  PRUNE_TARGET_BUILD_CACHE = 3;
}

message PruneDockerRequest {
  PruneTarget target = 1;
  // Compute and return the exact same plan without deleting anything.
  bool dry_run = 2;
  // Images only: limit to dangling (untagged) images. Ignored for other
  // targets, which have no equivalent notion.
  bool dangling_only = 3;
}

message PruneDockerResponse {
  // Names/ids actually removed (or that would be, under dry_run) — never
  // includes anything protected.
  repeated string removed = 1;
  uint64 reclaimed_bytes = 2;
  // Everything considered but not removed, with why: still needed by an
  // installed app, or (a real run only) the Engine refused the deletion.
  repeated PruneSkip skipped = 3;
}

message PruneSkip {
  string name = 1;
  string reason = 2;
}

// ── Backups (DMN-009, DMN-115) ──
//
// BackupService exposes the daemon's backup module over the API: the
// system-scope storage list (where archives go — the built-in "local", plus
// configured S3/FTP/SFTP/local-directory storages) and the archives
// themselves. The platform pushes its organization storages here as
// managed_by = "platform" before a backup, so machine-run schedules keep
// working without it (docs/backups.md). Gated behind the "backups"
// capability (DMN-076).
service BackupService {
  rpc ListBackupStorages(ListBackupStoragesRequest) returns (ListBackupStoragesResponse);
  // Adds or replaces a storage by name. Replacing an entry with a different
  // managed_by (an operator's own storage, say) is refused.
  rpc UpsertBackupStorage(UpsertBackupStorageRequest) returns (UpsertBackupStorageResponse);
  rpc RemoveBackupStorage(RemoveBackupStorageRequest) returns (RemoveBackupStorageResponse);
  // Archives of one app or of every app, on one storage or on every storage.
  // A storage that cannot be listed (unreachable S3) is reported in
  // `errors` instead of failing the whole call.
  rpc ListBackups(ListBackupsRequest) returns (ListBackupsResponse);
  // Archives the app once and pushes the same file to every storage; the
  // response carries one result per storage (a failed upload does not stop
  // the others). Runs until the backup is done — callers set a long deadline.
  rpc CreateBackup(CreateBackupRequest) returns (CreateBackupResponse);
  // Replaces the app's repository/config/data with the archive. The app must
  // be stopped — or stop_app set, in which case the daemon stops it, restores
  // and starts it again (when it was running before).
  rpc RestoreBackup(RestoreBackupRequest) returns (RestoreBackupResponse);
  rpc DeleteBackup(DeleteBackupRequest) returns (DeleteBackupResponse);
}

message BackupStorage {
  string name = 1;
  // local | s3 | ftp | sftp
  string type = 2;
  // "local" — the built-in, always-present storage (not stored, not removable).
  bool builtin = 3;
  optional string managed_by = 4;
  // Non-secret summary of the configuration: the directory for local, the
  // endpoint/bucket/region/prefix for s3, host/port/dir for ftp/sftp.
  // Credentials never leave the daemon through this message.
  string dir = 5;
  string s3_endpoint = 6;
  string s3_bucket = 7;
  string s3_region = 8;
  string s3_prefix = 9;
  string host = 10;
  uint32 port = 11;
}

message ListBackupStoragesRequest {}

message ListBackupStoragesResponse {
  // "local" first.
  repeated BackupStorage storages = 1;
}

message S3StorageConfig {
  // Empty — AWS for `region`; a host or http(s) URL otherwise.
  string endpoint = 1;
  string region = 2;
  string bucket = 3;
  string access_key = 4;
  string secret_key = 5;
  // Key prefix, e.g. "team/asc-backups/<node>" — archives go under it.
  string prefix = 6;
}

message LocalStorageConfig {
  string dir = 1;
}

message UpsertBackupStorageRequest {
  string name = 1;
  optional string managed_by = 2;
  oneof kind {
    S3StorageConfig s3 = 3;
    LocalStorageConfig local = 4;
  }
}

message UpsertBackupStorageResponse {
  BackupStorage storage = 1;
}

message RemoveBackupStorageRequest {
  string name = 1;
  // When set, only an entry carrying exactly this marker is removed.
  optional string managed_by = 2;
}

message RemoveBackupStorageResponse {}

message ListBackupsRequest {
  // Empty — every app.
  optional string app_id = 1;
  // Empty — every storage.
  optional string storage = 2;
}

message BackupEntry {
  string app_id = 1;
  string storage = 2;
  // <app-id>-<unix-ts>.tar.gz — what RestoreBackup/DeleteBackup take.
  string name = 3;
  uint64 size_bytes = 4;
  int64 created_unix = 5;
}

message BackupStorageError {
  string storage = 1;
  string error = 2;
}

message ListBackupsResponse {
  // Newest first.
  repeated BackupEntry backups = 1;
  repeated BackupStorageError errors = 2;
}

message CreateBackupRequest {
  string app_id = 1;
  // Empty — the app's own backup policy, else "local".
  repeated string storages = 2;
  // Rotation per storage after the upload; absent — the policy's keep.
  optional uint32 keep = 3;
  // Optional per-run file selection (DMN-118), glob patterns relative to
  // the app directory (`data/**/*.db`, `repository/vendor`). Non-empty
  // include — only matching files go into the archive; exclude is applied
  // on top of it and of the repository's asc.backup.yaml. A daemon that
  // predates these fields ignores them and archives everything.
  repeated string include = 4;
  repeated string exclude = 5;
}

message BackupResult {
  string storage = 1;
  // Empty when this storage failed.
  string name = 2;
  uint64 size_bytes = 3;
  string error = 4;
}

message CreateBackupResponse {
  repeated BackupResult results = 1;
}

message RestoreBackupRequest {
  string app_id = 1;
  string storage = 2;
  string name = 3;
  bool stop_app = 4;
}

message RestoreBackupResponse {
  // The app was running, got stopped for the restore and started again.
  bool restarted = 1;
}

message DeleteBackupRequest {
  string app_id = 1;
  string storage = 2;
  string name = 3;
}

message DeleteBackupResponse {}

// ── Scheduled jobs (DMN-012, DMN-114) ──
//
// ScheduleService manages the daemon's own scheduler jobs
// (<data_dir>/schedules.json): a trigger (hourly | daily@HH:MM | HH:MM | a
// five-field cron expression) plus one action. The platform keeps its
// "run on the machine" schedules here with ReplaceManagedSchedules — a full
// replace of the jobs it owns (managed_by), never touching jobs an operator
// added with `asc schedule add`. Gated behind the "schedules" capability.
service ScheduleService {
  rpc ListSchedules(ListSchedulesRequest) returns (ListSchedulesResponse);
  rpc UpsertSchedule(UpsertScheduleRequest) returns (UpsertScheduleResponse);
  rpc RemoveSchedule(RemoveScheduleRequest) returns (RemoveScheduleResponse);
  rpc ReplaceManagedSchedules(ReplaceManagedSchedulesRequest) returns (ReplaceManagedSchedulesResponse);
  // Starts the job now, outside its trigger, and returns the opened run
  // (status RUNNING) without waiting for it — poll ListScheduleRuns.
  rpc RunSchedule(RunScheduleRequest) returns (RunScheduleResponse);
  rpc ListScheduleRuns(ListScheduleRunsRequest) returns (ListScheduleRunsResponse);
}

message ScheduleAppTarget {
  string app_id = 1;
}

message ScheduleBackupJob {
  string app_id = 1;
  // Empty — the app's own backup policy, else "local".
  repeated string storages = 2;
  optional uint32 keep = 3;
  // Same as CreateBackupRequest.include/exclude.
  repeated string include = 4;
  repeated string exclude = 5;
}

message ScheduleShellJob {
  string command = 1;
  // Set — run in the app directory as the app's owner.
  optional string app_id = 2;
  // 0 — the daemon default (600 s); at most 3600.
  uint32 timeout_seconds = 3;
}

message ScheduleHttpJob {
  string method = 1;
  string url = 2;
  map<string, string> headers = 3;
  string body = 4;
  uint32 timeout_seconds = 5;
}

message ScheduleNodeReboot {}

enum ScheduleRunState {
  SCHEDULE_RUN_STATE_UNSPECIFIED = 0;
  SCHEDULE_RUN_STATE_RUNNING = 1;
  SCHEDULE_RUN_STATE_SUCCEEDED = 2;
  SCHEDULE_RUN_STATE_FAILED = 3;
}

message ScheduleRunRecord {
  string id = 1;
  ScheduleRunState state = 2;
  // schedule | manual
  string trigger = 3;
  int64 started_unix = 4;
  // 0 while running.
  int64 finished_unix = 5;
  string error = 6;
  // Shell stdout+stderr or the HTTP response body, capped at 64 KiB.
  string output = 7;
  // HTTP jobs; 0 when no response came back.
  uint32 http_status = 8;
}

message ScheduleJob {
  string id = 1;
  string trigger = 2;
  // Evaluate the trigger in UTC instead of the node's local time.
  bool utc = 3;
  bool enabled = 4;
  string comment = 5;
  optional string managed_by = 6;
  oneof action {
    ScheduleNodeReboot node_reboot = 10;
    ScheduleAppTarget app_start = 11;
    ScheduleAppTarget app_stop = 12;
    ScheduleAppTarget app_restart = 13;
    ScheduleAppTarget app_update = 14;
    ScheduleBackupJob backup = 15;
    ScheduleShellJob shell = 16;
    ScheduleHttpJob http = 17;
  }
  // Read-only, ignored on writes.
  optional ScheduleRunRecord last_run = 20;
  // Next firing (unix seconds); 0 — disabled or not within a year.
  int64 next_run_unix = 21;
  int64 created_unix = 22;
  int64 updated_unix = 23;
}

message ListSchedulesRequest {
  // When set, only jobs with exactly this marker.
  optional string managed_by = 1;
}

message ListSchedulesResponse {
  repeated ScheduleJob schedules = 1;
}

message UpsertScheduleRequest {
  ScheduleJob schedule = 1;
}

message UpsertScheduleResponse {
  ScheduleJob schedule = 1;
}

message RemoveScheduleRequest {
  string id = 1;
}

message RemoveScheduleResponse {
  bool removed = 1;
}

message ReplaceManagedSchedulesRequest {
  string managed_by = 1;
  repeated ScheduleJob schedules = 2;
}

message ReplaceManagedSchedulesResponse {
  repeated ScheduleJob schedules = 1;
}

message RunScheduleRequest {
  string id = 1;
}

message RunScheduleResponse {
  ScheduleRunRecord run = 1;
  // False when the job was already running — no second run was started
  // and `run` is empty.
  bool started = 2;
}

message ListScheduleRunsRequest {
  string id = 1;
  // 0 — 50 (the retained maximum).
  uint32 limit = 2;
}

message ListScheduleRunsResponse {
  // Newest first.
  repeated ScheduleRunRecord runs = 1;
}
