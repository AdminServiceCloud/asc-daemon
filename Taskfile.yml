# 🛠️ Taskfile — development, build and release commands for asc-daemon
# https://taskfile.dev · install: go install github.com/go-task/task/v3/cmd/task@latest
version: '3'

vars:
  TARGETS: x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu armv7-unknown-linux-gnueabihf
  # cargo-sweep by --time is useless here: with daily builds every artifact's
  # mtime is under 14 days old, so nothing ever looks "stale". --maxsize
  # instead evicts the oldest artifacts first, whatever their age, until
  # target/ fits under this cap.
  TARGET_MAXSIZE: 8GB

tasks:
  default:
    desc: 📋 List all commands
    cmds:
      - task --list

  # ── 🧑‍💻 Development ──────────────────────────────────────────────

  dev:
    desc: 🚀 Run the daemon locally (debug, verbose logs)
    cmds:
      - RUST_LOG=debug cargo run --bin asc -- serve

  dev:cli:
    desc: 💻 Run a CLI command against the local daemon (task dev:cli -- status)
    cmds:
      - cargo run --bin asc -- {{.CLI_ARGS}}

  dev:updater:
    desc: 🔄 Run asc-updater locally (task dev:updater -- status)
    cmds:
      - cargo run --bin asc-updater -- {{.CLI_ARGS}}

  proto:
    desc: 📜 Generate Rust code from the proto contracts (prost/tonic)
    cmds:
      - cargo build   # build.rs compiles proto/ via protox (no protoc needed)

  # ── ✅ Quality ────────────────────────────────────────────────────

  lint:
    desc: 🔍 Clippy + formatting check
    deps: [clean:sweep]
    cmds:
      - cargo clippy --all-targets --all-features -- -D warnings
      - cargo fmt --all -- --check

  fmt:
    desc: 🎨 Format the code
    cmds:
      - cargo fmt --all

  test:
    desc: 🧪 Tests
    deps: [clean:sweep]
    cmds:
      - cargo test --all

  check:
    desc: ✅ Full pre-commit check (lint + test)
    cmds:
      - task: lint
      - task: test

  # ── 🧹 Maintenance ───────────────────────────────────────────────

  tools:sweep:
    desc: 🧰 Install cargo-sweep if it's missing
    status:
      - command -v cargo-sweep
    cmds:
      - cargo install cargo-sweep --locked

  clean:sweep:
    desc: 🧹 Evict the oldest target/ artifacts until it fits under {{.TARGET_MAXSIZE}} (keeps the live cache, unlike `clean`)
    deps: [tools:sweep]
    cmds:
      - cargo sweep --maxsize {{.TARGET_MAXSIZE}} .

  clean:sweep:dry:
    desc: 👀 Preview what clean:sweep would remove, without deleting anything
    deps: [tools:sweep]
    cmds:
      - cargo sweep --dry-run --maxsize {{.TARGET_MAXSIZE}} .

  clean:
    desc: 🗑️ Wipe target/ entirely (full rebuild next time)
    cmds:
      - cargo clean

  # ── 📦 Build and release ──────────────────────────────────────────

  build:
    desc: 📦 Release build for the current platform (asc + asc-updater)
    deps: [clean:sweep]
    cmds:
      - cargo build --release

  build:cross:
    desc: 🧬 Cross-compile for all supported architectures (requires cross)
    deps: [clean:sweep]
    cmds:
      - for: { var: TARGETS }
        cmd: cross build --release --target {{.ITEM}}

  install:local:
    desc: 🔧 Install the built binaries into /usr/local/bin (requires sudo)
    deps: [build]
    cmds:
      - sudo install -m 755 target/release/asc /usr/local/bin/asc
      - sudo install -m 755 target/release/asc-updater /usr/local/bin/asc-updater

  # ── 🚀 Production ─────────────────────────────────────────────────

  prod:service:
    desc: 🚀 Install and start as a systemd service (requires sudo)
    deps: [install:local]
    cmds:
      - sudo asc service install
      - sudo systemctl enable --now asc

  prod:status:
    desc: 📊 Production service status
    cmds:
      - systemctl status asc --no-pager
      - asc status
