# рџ¦Ђ asc-daemon вЂ” AdminService.Cloud daemon, CLI (asc) and updater (asc-updater)
[package]
name = "asc-daemon"
version = "0.13.0"
edition = "2024"
license = "MIT"
authors = ["Omar El Sayed (@statebyte)"]
repository = "https://github.com/AdminServiceCloud/asc-daemon"
description = "Open source daemon & CLI for server management: apps (Docker & native), package manager, backups, monitoring, MCP server for AI"

[lib]
name = "asc_daemon"
path = "src/lib.rs"

[[bin]]
name = "asc"
path = "src/cli/main.rs"

[[bin]]
name = "asc-updater"
path = "src/updater/main.rs"

[dependencies]
anyhow = "1"
# Docker Engine API over the unix socket (no TLS stack: default features off
# keeps ring/openssl out, preserving pure-Rust cross-compilation).
# `buildkit_providerless` is the local-image-build session client (DMN-050):
# without it, `BuildInfo.aux` only deserializes the legacy builder's shape,
# and the Engine's BuildKit-compat translation sends other progress lines as
# an untyped protobuf blob there instead — aborting the whole build stream.
# It pulls in `rustls` transitively (`ssl_providerless`), but with no crypto
# provider selected (bollard's own rustls dep has default-features off) and
# unreachable here (we only ever `connect_with_unix`), so it stays inert.
# `time` is its own hard requirement for the session's OAuth code path.
bollard = { version = "0.21", default-features = false, features = ["pipe", "buildkit_providerless", "time"] }
# Tar build context bytes for the Docker image build (DMN-050) into a bollard body.
bytes = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
futures-util = "0.3"
prost = "0.14"
sha2 = "0.11"
tar = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
axum = { version = "0.8", features = ["ws"] }
# CLI → daemon client over the local unix socket (DMN-042): a minimal
# HTTP/1 JSON client — one connection per request, no TLS, no pooling.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "http1", "http2", "service"] }
# TLS for the daemon API when a node is reached directly instead of through
# the platform's SSH tunnel (DMN-061). rustls with the ring provider: release
# builds go through `cross`, whose images carry the C toolchains ring needs for
# aarch64/armv7. rcgen issues the self-signed certificate on first start.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time", "process", "io-util", "io-std"] }
# WebSocket client for `asc app attach` over the daemon socket (DMN-043):
# the daemon's console endpoint is a WebSocket, and this speaks it over the
# same UnixStream the REST client uses. No TLS: the peer is a local socket.
tokio-tungstenite = "0.30"
toml = "1.1"
tonic = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tonic-prost = "0.14.6"
# Docker pull / git clone progress bars (tty-gated, see src/daemon/progress.rs).
indicatif = "0.18.6"
# Official Model Context Protocol Rust SDK. The stdio transport keeps the
# server local: daemon authorization remains based on the UDS peer uid.
rmcp = { version = "3", features = ["server", "transport-io"] }
schemars = "1"

[build-dependencies]
# protox РєРѕРјРїРёР»РёСЂСѓРµС‚ .proto Р±РµР· РІРЅРµС€РЅРµРіРѕ protoc вЂ” СЃР±РѕСЂРєР° РіРµСЂРјРµС‚РёС‡РЅР°
protox = "0.9"
tonic-build = "0.14"
tonic-prost-build = "0.14.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
futures-util = "0.3"
tempfile = "3"
tokio-tungstenite = "0.30"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
strip = true
